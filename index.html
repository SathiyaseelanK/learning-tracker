<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Learning Tracker</title>
<style>
:root {
  --bg:#0b0e1a; --surface:#131729; --surface2:#1c2138; --surface3:#222840;
  --border:#252d4a; --border2:#2e3a5c;
  --accent:#3d7fff; --accent2:#6c4ff6;
  --green:#1fcc6e; --yellow:#f5a623; --red:#f04e4e; --purple:#a855f7;
  --text:#dce3f5; --text2:#7b87b0; --text3:#404870;
  --radius:12px; --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.login-logo{font-size:36px;margin-bottom:8px}
.login-title{font-size:22px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.login-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.login-input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:14px;outline:none;transition:border-color .2s}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:4px}
.login-btn:hover{opacity:.88}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{font-size:12px;color:var(--red);margin-top:8px;min-height:16px}
.login-spinner{display:none;font-size:12px;color:var(--text2);margin-top:8px}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:12px}
.loading-spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--text2)}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10}
.logo{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.logo-text{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stats-row{display:flex;gap:14px}
.stat{text-align:center}
.stat-v{font-size:17px;font-weight:700;color:var(--accent);line-height:1}
.stat-l{font-size:10px;color:var(--text3);margin-top:2px}
.user-pill{background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;cursor:pointer}
.user-pill:hover{border-color:var(--accent);color:var(--text)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.sync-dot.syncing{background:var(--yellow);animation:pulse 1s infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* PLAN TABS */
.plan-tabs-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:4px;overflow-x:auto}
.plan-tab{padding:10px 16px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;display:flex;align-items:center;gap:6px}
.plan-tab:hover{color:var(--text)}
.plan-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.plan-tab .tab-badge{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--surface2)}
.plan-tab.active .tab-badge{background:rgba(61,127,255,.2);color:var(--accent)}
.plan-tab .tab-status{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.add-plan-btn{padding:8px 14px;font-size:12px;font-weight:500;color:var(--accent);cursor:pointer;white-space:nowrap;background:none;border:none;display:flex;align-items:center;gap:5px;margin-left:4px}
.add-plan-btn:hover{color:var(--text)}

/* PROGRESS */
.prog-wrap{padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:4px}
.prog-bar{height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* MAIN LAYOUT */
.main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 130px)}
@media(max-width:680px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-title{font-size:13px;font-weight:600}
.cal-nav{background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:13px}
.cal-nav:hover{color:var(--text);border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dl{text-align:center;font-size:9px;color:var(--text3);padding:3px 0;font-weight:600}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px;cursor:pointer;position:relative;transition:background .12s;color:var(--text2)}
.cal-day:hover:not(.empty){background:var(--surface2);color:var(--text)}
.cal-day.empty{cursor:default}
.cal-day.today{background:var(--surface2);border:1px solid var(--border2);color:var(--accent);font-weight:700}
.cal-day.has-session{color:var(--text);font-weight:600}
.cal-day::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;display:none}
.cal-day.completed::after{display:block;background:var(--green)}
.cal-day.skipped::after{display:block;background:var(--yellow)}
.cal-day.pending::after{display:block;background:var(--accent)}
.cal-day.selected{background:var(--accent)!important;color:#fff!important}
.cal-day.selected::after{display:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.leg-dot{width:7px;height:7px;border-radius:50%}
.slist-title{font-size:10px;color:var(--text3);letter-spacing:.4px;margin:12px 0 6px;font-weight:600}
.slist-item{padding:7px 10px;border-radius:8px;border:1px solid var(--border);margin-bottom:4px;cursor:pointer;transition:border-color .12s}
.slist-item:hover{border-color:var(--border2)}
.slist-item.active{border-color:var(--accent);background:rgba(61,127,255,.07)}
.slist-date{font-size:10px;color:var(--text3)}
.slist-name{font-size:12px;font-weight:500;margin-top:2px;line-height:1.3}
.slist-status{font-size:10px;margin-top:2px}

/* DETAIL */
.detail{padding:20px;overflow-y:auto}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;color:var(--text3);gap:8px;font-size:13px}

/* PLAN DASHBOARD (shown when no session selected) */
.dashboard{padding:20px;overflow-y:auto}
.dash-title{font-size:18px;font-weight:700;margin-bottom:4px}
.dash-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.plans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:24px}
.plan-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.plan-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.plan-card.active-plan{border-color:var(--accent)}
.plan-card-icon{font-size:28px;margin-bottom:10px}
.plan-card-name{font-size:14px;font-weight:700;margin-bottom:3px}
.plan-card-desc{font-size:11px;color:var(--text2);margin-bottom:12px;line-height:1.5}
.plan-card-prog{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:6px}
.plan-card-fill{height:100%;border-radius:99px}
.plan-card-stats{display:flex;justify-content:space-between;font-size:10px;color:var(--text2)}
.plan-card-status{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:8px}
.status-active{background:rgba(61,127,255,.12);color:var(--accent)}
.status-notstarted{background:var(--surface2);color:var(--text3)}
.status-completed{background:rgba(31,204,110,.12);color:var(--green)}
.status-inprogress{background:rgba(245,166,35,.12);color:var(--yellow)}

/* ADD PLAN MODAL */
.add-plan-modal .modal{max-width:480px}
.plan-template-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.plan-template{border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:border-color .15s;text-align:center}
.plan-template:hover,.plan-template.selected{border-color:var(--accent);background:rgba(61,127,255,.05)}
.plan-template-icon{font-size:22px;margin-bottom:4px}
.plan-template-name{font-size:12px;font-weight:600}
.plan-template-sub{font-size:10px;color:var(--text2);margin-top:2px}

/* SESSION CARD */
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;max-width:700px}
.scard-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.scard-meta{font-size:11px;color:var(--text2);margin-bottom:4px}
.scard-title{font-size:16px;font-weight:700;line-height:1.3}
.scard-time{font-size:12px;color:var(--accent);margin-top:4px}
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.badge-pending{background:rgba(61,127,255,.12);color:var(--accent)}
.badge-completed{background:rgba(31,204,110,.12);color:var(--green)}
.badge-skipped{background:rgba(245,166,35,.12);color:var(--yellow)}
.scard-body{padding:18px 20px}
.tip-box{background:rgba(61,127,255,.06);border:1px solid rgba(61,127,255,.18);border-radius:8px;padding:11px 13px;margin-bottom:14px}
.tip-lbl{font-size:10px;color:var(--accent);font-weight:700;margin-bottom:3px;letter-spacing:.4px}
.tip-txt{font-size:12px;color:var(--text2);line-height:1.7}
.topics-lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.4px;margin-bottom:7px}
.topic-item{display:flex;gap:9px;padding:9px 11px;background:var(--surface2);border-radius:8px;margin-bottom:4px;align-items:flex-start}
.t-num{font-size:10px;font-weight:700;color:var(--accent2);min-width:18px;margin-top:1px}
.t-txt{font-size:12px;line-height:1.6;color:var(--text)}
.impact-box{font-size:12px;border-radius:8px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
.impact-box.ok{background:rgba(31,204,110,.08);border:1px solid rgba(31,204,110,.2);color:var(--green)}
.impact-box.warn{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.2);color:var(--yellow)}
.note-wrap{margin-top:13px}
.note-lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.4px;margin-bottom:5px}
.note-input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:9px 11px;font-size:12px;resize:vertical;min-height:60px;outline:none;font-family:var(--font);transition:border-color .15s}
.note-input:focus{border-color:var(--accent)}
/* Guidance */
.guidance-wrap{margin-top:16px;border-top:1px solid var(--border);padding-top:14px}
.guidance-lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.4px;margin-bottom:8px}
.guidance-block{background:var(--surface2);border:1px solid var(--border);border-radius:9px;margin-bottom:6px;overflow:hidden}
.guidance-header{padding:9px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.guidance-header:hover{background:var(--border)}
.guidance-topic{font-size:12px;font-weight:600;color:var(--text)}
.guidance-toggle{font-size:11px;color:var(--text3);transition:transform .2s}
.guidance-toggle.open{transform:rotate(180deg)}
.guidance-steps{padding:0 13px 10px;display:none}
.guidance-steps.open{display:block}
.guidance-step{display:flex;gap:9px;margin-bottom:7px;align-items:flex-start}
.step-num{font-size:10px;font-weight:700;color:var(--accent2);background:rgba(108,79,246,.15);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.step-txt{font-size:12px;color:var(--text2);line-height:1.6}
.step-txt a{color:var(--accent);text-decoration:none}
.step-txt a:hover{text-decoration:underline}
/* Action row */
.action-row{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface2);align-items:center}
.btn{padding:8px 15px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-complete{background:var(--green);color:#000}
.btn-skip{background:var(--yellow);color:#000}
.btn-undo{background:var(--surface);border:1px solid var(--border2);color:var(--text2)}
.btn-multi{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-danger{background:var(--red);color:#fff}
.sync-msg{font-size:11px;color:var(--text3);margin-left:auto}
/* Upcoming */
.upcoming{margin-top:20px;max-width:700px}
.upcoming-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px}
.ucard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 13px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;transition:border-color .12s}
.ucard:hover{border-color:var(--border2)}
.ucard-date{font-size:10px;color:var(--text3)}
.ucard-name{font-size:12px;font-weight:500;margin-top:2px}
.utag{font-size:10px;padding:2px 8px;border-radius:99px;flex-shrink:0;white-space:nowrap}
.utag-rs{background:rgba(245,166,35,.12);color:var(--yellow)}
.utag-ok{background:rgba(31,204,110,.10);color:var(--green)}
.utag-today{background:rgba(61,127,255,.15);color:var(--accent);font-weight:700}
.utag-early{background:rgba(108,79,246,.15);color:var(--accent2)}
/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:26px;max-width:420px;width:92%}
.modal-title{font-size:15px;font-weight:700;margin-bottom:8px}
.modal-body{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px}
.modal-label{font-size:11px;color:var(--text2);margin-bottom:5px}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:8px 11px;font-size:13px;margin-bottom:12px;outline:none}
.modal-input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
/* TOP NAV */
.top-nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 20px;gap:4px}
.top-nav-btn{padding:11px 18px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;user-select:none}
.top-nav-btn:hover{color:var(--text)}
.top-nav-btn.active{color:var(--text);border-bottom-color:var(--accent)}

/* FULL DASHBOARD */
.full-dash{padding:20px;overflow-y:auto;max-height:calc(100vh - 130px)}
.fd-title{font-size:20px;font-weight:700;margin-bottom:2px}
.fd-sub{font-size:13px;color:var(--text2);margin-bottom:20px}

/* MOTIVATIONAL HERO */
.hero-banner{background:linear-gradient(135deg,rgba(61,127,255,.15),rgba(108,79,246,.15));border:1px solid rgba(61,127,255,.25);border-radius:14px;padding:20px 24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.hero-left{}
.hero-greeting{font-size:22px;font-weight:700;margin-bottom:4px}
.hero-quote{font-size:13px;color:var(--text2);max-width:500px;line-height:1.6;font-style:italic}
.hero-right{text-align:center}
.hero-streak{font-size:48px;font-weight:800;line-height:1;color:var(--accent)}
.hero-streak-lbl{font-size:11px;color:var(--text2);margin-top:2px}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi-icon{font-size:20px;margin-bottom:6px}
.kpi-val{font-size:22px;font-weight:700;line-height:1;margin-bottom:2px}
.kpi-lbl{font-size:11px;color:var(--text2)}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:3px}

/* CHARTS GRID */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
@media(max-width:700px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.chart-card.full{grid-column:1/-1}
.chart-title{font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.chart-sub{font-size:11px;color:var(--text2);margin-left:auto;font-weight:400}
canvas{width:100%!important}

/* DONUT */
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut-canvas{flex-shrink:0}
.donut-legend{flex:1;min-width:100px}
.donut-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.donut-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.donut-val{font-weight:700;margin-left:auto;color:var(--text)}

/* HEATMAP */
.heatmap{display:grid;grid-template-columns:repeat(26,1fr);gap:2px}
.hm-cell{aspect-ratio:1;border-radius:2px;background:var(--border);cursor:default;transition:transform .1s;position:relative}
.hm-cell:hover{transform:scale(1.4);z-index:1}
.hm-cell.done{background:var(--green)}
.hm-cell.skipped{background:var(--yellow)}
.hm-cell.today{box-shadow:0 0 0 1px var(--accent)}
.hm-months{display:grid;grid-template-columns:repeat(26,1fr);gap:2px;margin-bottom:4px}
.hm-month-lbl{font-size:9px;color:var(--text3);text-align:center}
.hm-legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.hm-leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.hm-leg-box{width:10px;height:10px;border-radius:2px}

/* ACHIEVEMENTS */
.achievements-section{margin-bottom:20px}
.ach-title{font-size:14px;font-weight:600;margin-bottom:12px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ach-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;transition:transform .15s;position:relative;overflow:hidden}
.ach-card:hover{transform:translateY(-2px)}
.ach-card.unlocked{border-color:var(--accent);background:linear-gradient(135deg,rgba(61,127,255,.08),rgba(108,79,246,.05))}
.ach-card.locked{opacity:.45;filter:grayscale(.8)}
.ach-icon{font-size:30px;margin-bottom:6px;display:block}
.ach-name{font-size:12px;font-weight:700;margin-bottom:3px}
.ach-desc{font-size:10px;color:var(--text2);line-height:1.4}
.ach-unlocked-badge{position:absolute;top:8px;right:8px;font-size:10px;color:var(--green)}
.ach-progress-bar{height:3px;background:var(--border);border-radius:99px;margin-top:8px;overflow:hidden}
.ach-progress-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .5s}
.new-badge{position:absolute;top:8px;left:8px;background:var(--yellow);color:#000;font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px}

/* WEEKLY PLAN */
.week-plan{margin-bottom:20px}
.week-plan-title{font-size:14px;font-weight:600;margin-bottom:10px}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-day{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center}
.week-day.today-col{border-color:var(--accent);background:rgba(61,127,255,.08)}
.week-day.done-col{border-color:var(--green);background:rgba(31,204,110,.06)}
.week-day.skip-col{border-color:var(--yellow);background:rgba(245,166,35,.06)}
.wd-name{font-size:9px;color:var(--text3);margin-bottom:4px;font-weight:600}
.wd-date{font-size:11px;font-weight:600;margin-bottom:4px}
.wd-session{font-size:9px;color:var(--text2);line-height:1.3;min-height:24px}
.wd-status{font-size:10px;margin-top:4px}

/* MOTIVATIONAL QUOTE ROTATOR */
.quote-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:20px;display:flex;gap:14px;align-items:flex-start}
.quote-icon{font-size:24px;flex-shrink:0;margin-top:2px}
.quote-text{font-size:13px;color:var(--text2);line-height:1.7;font-style:italic;flex:1}
.quote-author{font-size:11px;color:var(--text3);margin-top:4px}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:10px 15px;font-size:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:999;transform:translateY(60px);opacity:0;transition:all .3s;max-width:280px;line-height:1.5}
.toast.show{transform:translateY(0);opacity:1}

/* ACHIEVEMENT POPUP */
.ach-popup{position:fixed;top:20px;right:20px;background:linear-gradient(135deg,#1c2138,#222840);border:1px solid var(--accent);border-radius:14px;padding:16px 20px;z-index:1000;display:flex;gap:12px;align-items:center;max-width:300px;box-shadow:0 12px 40px rgba(0,0,0,.5);transform:translateX(120%);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.ach-popup.show{transform:translateX(0)}
.ach-popup-icon{font-size:32px;flex-shrink:0}
.ach-popup-text{}
.ach-popup-label{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.5px;margin-bottom:3px}
.ach-popup-name{font-size:14px;font-weight:700;margin-bottom:2px}
.ach-popup-desc{font-size:11px;color:var(--text2)}
</style>
</head>

      <div class="slist-title">Sessions</div>

    <div id="detail-panel">

    </div>
  </div>

<div class="toast" id="toast"></div>
<div class="ach-popup" id="ach-popup">

// ── STATE ──────────────────────────────────────────────────────────────────
let state = {};       // { 'planId:moduleId': { status, note, updatedAt } }
let activePlanId = 'gcp';
let enabledPlans = ['gcp']; // plans user has activated
let selectedSessionKey = null;
let calMonth = new Date(2026, 8);
let sessionToken = null;

function stateKey(planId, moduleId) { return `${planId}:${moduleId}`; }

function getSession() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch { return null; } }
function saveSession(token) { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ token })); }
function clearSession() { sessionStorage.removeItem(SESSION_KEY); }

// ── API ────────────────────────────────────────────────────────────────────
async function apiGet() {
  const url = `${WEBAPP_URL}?action=get&token=${encodeURIComponent(sessionToken)}`;
  const r = await fetch(url);
  return r.json();
}
async function apiSave(key, status, note) {
  const r = await fetch(WEBAPP_URL, { method:'POST', body: JSON.stringify({ action:'save', token:sessionToken, moduleId:key, status, note:note||'' }) });
  return r.json();
}
async function apiDelete(key) {
  const r = await fetch(WEBAPP_URL, { method:'POST', body: JSON.stringify({ action:'delete', token:sessionToken, moduleId:key }) });
  return r.json();
}
async function apiSaveMeta(key, value) {
  // Store plan metadata as special rows prefixed with 'meta:'
  const r = await fetch(WEBAPP_URL, { method:'POST', body: JSON.stringify({ action:'save', token:sessionToken, moduleId:'meta:'+key, status:value, note:'' }) });
  return r.json();
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const token = document.getElementById('login-token').value.trim();
  const err = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  const spinner = document.getElementById('login-spinner');
  err.textContent = '';
  if (!email || !token) { err.textContent = 'Please enter email and token.'; return; }
  if (email.toLowerCase() !== ALLOWED_EMAIL.toLowerCase()) { err.textContent = 'Unauthorised email.'; return; }
  btn.disabled = true; spinner.style.display = 'block'; sessionToken = token;
  try {
    const res = await apiGet();
    if (!res.success) { err.textContent = res.error || 'Invalid token.'; sessionToken = null; }
    else {
      loadFromSheet(res.data || []);
      saveSession(token);
      showApp();
    }
  } catch(e) { err.textContent = 'Connection failed. Check your internet.'; sessionToken = null; }
  btn.disabled = false; spinner.style.display = 'none';
}

function loadFromSheet(rows) {
  rows.forEach(row => {
    if (!row.moduleId) return;
    if (row.moduleId.startsWith('meta:')) {
      const key = row.moduleId.replace('meta:','');
      if (key === 'enabledPlans') { try { enabledPlans = JSON.parse(row.status); } catch {} }
      if (key === 'activePlan') { activePlanId = row.status || 'gcp'; }
    } else {
      state[row.moduleId] = { status: row.status, note: row.note, updatedAt: row.updatedAt };
    }
  });
  // Always ensure gcp is enabled
  if (!enabledPlans.includes('gcp')) enabledPlans.unshift('gcp');
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-label').textContent = ALLOWED_EMAIL.split('@')[0];
  init();
}

function logout() {
  if (!confirm('Sign out? Progress is saved in Google Sheets.')) return;
  clearSession(); sessionToken = null; state = {}; location.reload();
}

// ── SCHEDULE ───────────────────────────────────────────────────────────────
function nextWeekday(date) {
  const d = new Date(date); d.setDate(d.getDate()+1);
  while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1);
  return d;
}

// Get start date for a plan (plans run sequentially)
function getPlanStartDate(planId) {
  const planOrder = enabledPlans;
  const idx = planOrder.indexOf(planId);
  if (idx <= 0) return new Date(2026, 8, 25); // Sept 25 2026
  // Start after previous plan's last session
  const prevPlanId = planOrder[idx-1];
  const prevDates = Object.values(getEffectiveDatesForPlan(prevPlanId));
  if (!prevDates.length) return new Date(2026, 8, 25);
  const lastDate = prevDates.reduce((a,b) => a>b?a:b);
  return nextWeekday(lastDate);
}

function getEffectiveDatesForPlan(planId) {
  const plan = PLAN_REGISTRY[planId];
  if (!plan) return {};
  const modules = plan.sessions;
  const START = getPlanStartDate(planId);
  const result = {};

  const completedIds = modules.filter(m => state[stateKey(planId,m.id)]?.status==='completed').map(m=>m.id);
  const skippedIds   = modules.filter(m => state[stateKey(planId,m.id)]?.status==='skipped').map(m=>m.id);
  const pendingIds   = modules.filter(m => !state[stateKey(planId,m.id)]?.status || state[stateKey(planId,m.id)]?.status==='pending').map(m=>m.id);

  const completedSorted = completedIds.slice().sort((a,b) => {
    const ta = new Date(state[stateKey(planId,a)]?.updatedAt||0).getTime();
    const tb = new Date(state[stateKey(planId,b)]?.updatedAt||0).getTime();
    return ta-tb;
  });

  completedSorted.forEach(id => {
    const at = state[stateKey(planId,id)]?.updatedAt ? new Date(state[stateKey(planId,id)].updatedAt) : null;
    if (at) result[id] = new Date(at);
  });

  let last = new Date(START); last.setDate(last.getDate()-1);
  Object.values(result).forEach(d => { if(d>last) last=new Date(d); });

  let next = completedSorted.length>0 ? nextWeekday(last) : new Date(START);
  while(next.getDay()===0||next.getDay()===6) next.setDate(next.getDate()+1);
  const today = new Date(); today.setHours(0,0,0,0);
  if(next<today && pendingIds.length>0) { next=new Date(today); while(next.getDay()===0||next.getDay()===6) next.setDate(next.getDate()+1); }

  pendingIds.forEach(id => { result[id]=new Date(next); next=nextWeekday(next); });
  skippedIds.forEach(id => { result[id]=new Date(next); next=nextWeekday(next); });
  return result;
}

// ── TABS ───────────────────────────────────────────────────────────────────
function renderTabs() {
  const bar = document.getElementById('plan-tabs-bar');
  bar.innerHTML = '';
  enabledPlans.forEach(pid => {
    const plan = PLAN_REGISTRY[pid];
    const modules = plan.sessions;
    const done = modules.filter(m => state[stateKey(pid,m.id)]?.status==='completed').length;
    const total = modules.length;
    const tab = document.createElement('div');
    tab.className = 'plan-tab' + (pid===activePlanId?' active':'');
    tab.innerHTML = `${plan.icon} ${plan.name} <span class="tab-badge">${done}/${total}</span>`;
    tab.onclick = () => switchPlan(pid);
    bar.appendChild(tab);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'add-plan-btn';
  addBtn.innerHTML = '+ Add Plan';
  addBtn.onclick = showAddPlanModal;
  bar.appendChild(addBtn);
}

async function switchPlan(pid) {
  activePlanId = pid;
  selectedSessionKey = null;
  renderTabs(); renderProgress(); renderCalendar(); renderSList();
  renderDashboard();
  try { await apiSaveMeta('activePlan', pid); } catch {}
}

// ── PROGRESS ───────────────────────────────────────────────────────────────
function renderProgress() {
  const plan = PLAN_REGISTRY[activePlanId];
  if (!plan) return;
  const modules = plan.sessions;
  const done = modules.filter(m => state[stateKey(activePlanId,m.id)]?.status==='completed').length;
  const pct = Math.round((done/modules.length)*100);
  document.getElementById('prog-plan-name').textContent = `${plan.icon} ${plan.name}`;
  document.getElementById('prog-pct').textContent = pct+'%';
  const fill = document.getElementById('prog-fill');
  fill.style.width = pct+'%';
  fill.style.background = `linear-gradient(90deg, ${plan.color}, var(--green))`;
}

// ── GLOBAL STATS ───────────────────────────────────────────────────────────
function updateGlobalStats() {
  let totalDone = 0;
  enabledPlans.forEach(pid => {
    const plan = PLAN_REGISTRY[pid];
    if (plan) totalDone += plan.sessions.filter(m => state[stateKey(pid,m.id)]?.status==='completed').length;
  });
  document.getElementById('s-total-done').textContent = totalDone;
  document.getElementById('s-plans').textContent = enabledPlans.length;

  // Streak across all plans
  const allCompleted = [];
  enabledPlans.forEach(pid => {
    const plan = PLAN_REGISTRY[pid];
    if (!plan) return;
    const dates = getEffectiveDatesForPlan(pid);
    plan.sessions.filter(m => state[stateKey(pid,m.id)]?.status==='completed').forEach(m => {
      if (dates[m.id]) allCompleted.push(new Date(dates[m.id]));
    });
  });
  allCompleted.sort((a,b)=>b-a);
  let streak=0, check=new Date(); check.setHours(0,0,0,0);
  for(const d of allCompleted) {
    const cd=new Date(d); cd.setHours(0,0,0,0);
    if(Math.abs(check-cd)<=86400000){streak++;check=cd;check.setDate(check.getDate()-1);}else break;
  }
  document.getElementById('s-streak').textContent = streak+'🔥';
  setSyncState('synced');
}

// ── CALENDAR ───────────────────────────────────────────────────────────────
function renderCalendar() {
  const dates = getEffectiveDatesForPlan(activePlanId);
  const dateToIds = {};
  Object.entries(dates).forEach(([id,d]) => {
    const k=d.toDateString();
    if(!dateToIds[k]) dateToIds[k]=[];
    dateToIds[k].push(+id);
  });
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  document.getElementById('cal-month').textContent = calMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d=>{
    const el=document.createElement('div');el.className='cal-dl';el.textContent=d;grid.appendChild(el);
  });
  const firstDay=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), today=new Date().toDateString();
  for(let i=0;i<firstDay;i++){const el=document.createElement('div');el.className='cal-day empty';grid.appendChild(el);}
  for(let d=1;d<=days;d++){
    const date=new Date(y,m,d), k=date.toDateString();
    const el=document.createElement('div'); el.className='cal-day'; el.textContent=d;
    if(k===today) el.classList.add('today');
    const ids=dateToIds[k]||[];
    if(ids.length){
      el.classList.add('has-session');
      const statuses=ids.map(id=>state[stateKey(activePlanId,id)]?.status);
      if(statuses.every(s=>s==='completed')) el.classList.add('completed');
      else if(statuses.every(s=>s==='skipped')) el.classList.add('skipped');
      else el.classList.add('pending');
      const selId = selectedSessionKey ? +selectedSessionKey.split(':')[1] : null;
      if(selId && ids.includes(selId)) el.classList.add('selected');
      el.onclick=()=>selectSession(stateKey(activePlanId,ids[0]));
    }
    grid.appendChild(el);
  }
}
function changeMonth(d){calMonth.setMonth(calMonth.getMonth()+d);renderCalendar();}

// ── SESSION LIST ───────────────────────────────────────────────────────────
function renderSList() {
  const plan = PLAN_REGISTRY[activePlanId];
  if (!plan) return;
  const dates = getEffectiveDatesForPlan(activePlanId);
  const c = document.getElementById('slist');
  c.innerHTML='';
  plan.sessions.forEach(m => {
    const sk = stateKey(activePlanId, m.id);
    const d = dates[m.id];
    const status = state[sk]?.status||'pending';
    const el=document.createElement('div');
    el.className='slist-item'+(selectedSessionKey===sk?' active':'');
    el.innerHTML=`
      <div class="slist-date">${d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):''}</div>
      <div class="slist-name">Day ${m.id}: ${m.title}</div>
      <div class="slist-status" style="color:${status==='completed'?'var(--green)':status==='skipped'?'var(--yellow)':'var(--text3)'}">
        ${status==='completed'?'✓ Completed':status==='skipped'?'↷ Skipped':'○ Pending'}
      </div>`;
    el.onclick=()=>selectSession(sk);
    c.appendChild(el);
  });
}

// ── DASHBOARD ──────────────────────────────────────────────────────────────
function renderDashboard() {
  const panel = document.getElementById('detail-panel');
  panel.innerHTML = '<div class="dashboard" id="dashboard"></div>';
  const dash = document.getElementById('dashboard');

  const allPlanIds = Object.keys(PLAN_REGISTRY);
  const available = allPlanIds.filter(pid => !enabledPlans.includes(pid));

  dash.innerHTML = `
    <div class="dash-title">🎓 My Learning Plans</div>
    <div class="dash-sub">Click a plan to switch to it. Add new plans from the button above.</div>
    <div class="plans-grid">
      ${enabledPlans.map(pid => {
        const plan = PLAN_REGISTRY[pid];
        const modules = plan.sessions;
        const done = modules.filter(m => state[stateKey(pid,m.id)]?.status==='completed').length;
        const skipped = modules.filter(m => state[stateKey(pid,m.id)]?.status==='skipped').length;
        const pct = Math.round((done/modules.length)*100);
        const statusLabel = done===0?'Not started':done===modules.length?'Completed':skipped>0?'In progress (has skips)':'In progress';
        const statusClass = done===0?'status-notstarted':done===modules.length?'status-completed':'status-inprogress';
        return `<div class="plan-card${pid===activePlanId?' active-plan':''}" onclick="switchPlan('${pid}')">
          <div class="plan-card-icon">${plan.icon}</div>
          <div class="plan-card-name">${plan.name}</div>
          <div class="plan-card-desc">${plan.desc}</div>
          <div class="plan-card-prog"><div class="plan-card-fill" style="width:${pct}%;background:${plan.color}"></div></div>
          <div class="plan-card-stats"><span>${done}/${modules.length} sessions</span><span>${pct}% complete</span></div>
          <span class="plan-card-status ${statusClass}">${statusLabel}</span>
        </div>`;
      }).join('')}
      ${available.length ? `<div class="plan-card" onclick="showAddPlanModal()" style="border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:160px">
        <div style="font-size:32px">+</div>
        <div style="font-size:13px;font-weight:600;color:var(--text2)">Add Next Plan</div>
        <div style="font-size:11px;color:var(--text3)">Azure, AWS, NestJS, React…</div>
      </div>` : ''}
    </div>
  `;
}

// ── ADD PLAN MODAL ─────────────────────────────────────────────────────────
function showAddPlanModal() {
  const available = Object.keys(PLAN_REGISTRY).filter(pid => !enabledPlans.includes(pid));
  if (!available.length) { showToast('All plans are already added!'); return; }

  let selectedTemplate = available[0];
  const modal = document.createElement('div');
  modal.className='modal-bg'; modal.id='add-plan-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:500px">
      <div class="modal-title">+ Add Learning Plan</div>
      <div class="modal-body">Choose a plan to add to your learning journey. It will start automatically after your current active plan completes.</div>
      <div class="plan-template-grid" id="template-grid">
        ${available.map(pid => {
          const plan = PLAN_REGISTRY[pid];
          return `<div class="plan-template${pid===selectedTemplate?' selected':''}" id="tmpl-${pid}" onclick="selectTemplate('${pid}')">
            <div class="plan-template-icon">${plan.icon}</div>
            <div class="plan-template-name">${plan.name}</div>
            <div class="plan-template-sub">${plan.sessions.length} sessions</div>
          </div>`;
        }).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn btn-undo" onclick="closeModal()">Cancel</button>
        <button class="btn btn-complete" onclick="addPlan()">Add Plan</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  window._selectedTemplate = selectedTemplate;
}

function selectTemplate(pid) {
  window._selectedTemplate = pid;
  document.querySelectorAll('.plan-template').forEach(el => el.classList.remove('selected'));
  document.getElementById('tmpl-'+pid)?.classList.add('selected');
}

async function addPlan() {
  const pid = window._selectedTemplate;
  if (!pid || enabledPlans.includes(pid)) { closeModal(); return; }
  enabledPlans.push(pid);
  closeModal();
  try {
    await apiSaveMeta('enabledPlans', JSON.stringify(enabledPlans));
  } catch {}
  renderTabs(); renderDashboard();
  showToast(`✅ ${PLAN_REGISTRY[pid].name} added! It starts after your current plan.`);
}

function closeModal() {
  document.querySelectorAll('.modal-bg').forEach(el=>el.remove());
}

// ── SESSION DETAIL ─────────────────────────────────────────────────────────
function selectSession(sk) {
  selectedSessionKey = sk;
  renderCalendar(); renderSList(); renderSessionDetail();
}

function renderSessionDetail() {
  const [planId, moduleIdStr] = selectedSessionKey.split(':');
  const moduleId = +moduleIdStr;
  const plan = PLAN_REGISTRY[planId];
  if (!plan) return;
  const m = plan.sessions.find(x=>x.id===moduleId);
  if (!m) return;

  const dates = getEffectiveDatesForPlan(planId);
  const d = dates[m.id];
  const status = state[selectedSessionKey]?.status||'pending';
  const note = state[selectedSessionKey]?.note||'';
  const done=status==='completed', skipped=status==='skipped';

  const nextPending = plan.sessions.filter(x => x.id>m.id && (!state[stateKey(planId,x.id)]?.status||state[stateKey(planId,x.id)]?.status==='pending')).slice(0,2);

  const pending = plan.sessions.filter(x => !state[stateKey(planId,x.id)]?.status||state[stateKey(planId,x.id)]?.status==='pending');
  const skippedCount = plan.sessions.filter(x => state[stateKey(planId,x.id)]?.status==='skipped').length;
  let impactMsg = '';
  if (!done&&!skipped) {
    impactMsg = skippedCount>0
      ? `<div class="impact-box warn">⚠️ You have ${skippedCount} skipped session${skippedCount>1?'s':''} queued at end of plan.</div>`
      : `<div class="impact-box ok">✅ On track — ${pending.length} sessions remaining.</div>`;
  }
  if (skipped) {
    impactMsg = `<div class="impact-box warn">↷ Rescheduled to ${d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'end of plan'}.</div>`;
  }

  const panel = document.getElementById('detail-panel');
  panel.innerHTML = `
    <div class="detail">
      <div class="scard">
        <div class="scard-head">
          <div>
            <div class="scard-meta">${plan.icon} ${plan.name} · Week ${m.week} · Day ${m.id} of ${plan.sessions.length} · ${m.course}</div>
            <div class="scard-title">${m.title}</div>
            <div class="scard-time">🕒 ${d?d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):''} · 3:00–4:00 PM</div>
          </div>
          <span class="badge badge-${status}">${done?'✓ Done':skipped?'↷ Skipped':'Pending'}</span>
        </div>
        <div class="scard-body">
          ${impactMsg}
          <div class="tip-box"><div class="tip-lbl">💡 Focus Tip</div><div class="tip-txt">${m.tip}</div></div>
          <div class="topics-lbl">What to cover in your 2 hours</div>
          ${m.topics.map((t,i)=>`<div class="topic-item"><div class="t-num">${i+1}</div><div class="t-txt">${t}</div></div>`).join('')}
          <div class="note-wrap">
            <div class="note-lbl">Your Notes (saved to Google Sheets)</div>
            <textarea class="note-input" id="note-input" placeholder="Add notes, questions, or what you learned today…">${note}</textarea>
          </div>
          ${m.guidance&&m.guidance.length ? `
          <div class="guidance-wrap">
            <div class="guidance-lbl">📖 Step-by-step learning guide — click each topic to expand</div>
            ${m.guidance.map((g,gi)=>`
              <div class="guidance-block">
                <div class="guidance-header" onclick="toggleGuidance(${gi})">
                  <div class="guidance-topic">🔗 ${g.topic}</div>
                  <div class="guidance-toggle" id="gt-${gi}">▼</div>
                </div>
                <div class="guidance-steps" id="gs-${gi}">
                  ${g.steps.map((step,si)=>`<div class="guidance-step"><div class="step-num">Step ${si+1}</div><div class="step-txt">${linkify(step)}</div></div>`).join('')}
                </div>
              </div>`).join('')}
          </div>` : ''}
        </div>
        <div class="action-row">
          ${!done&&!skipped ? `
            <button class="btn btn-complete" onclick="markSession('${selectedSessionKey}','completed')">✓ Done</button>
            ${nextPending.length>0?`<button class="btn btn-multi" onclick="markMultiple(['${selectedSessionKey}',${nextPending.map(x=>`'${stateKey(planId,x.id)}'`).join(',')}])">⚡ Done + ${nextPending.length} more today</button>`:''}
            <button class="btn btn-skip" onclick="confirmSkip('${selectedSessionKey}')">↷ Skip</button>
          ` : `
            <button class="btn btn-undo" onclick="markSession('${selectedSessionKey}','pending')">↩ Undo</button>
            <span style="font-size:11px;color:var(--text3);align-self:center">${done?'✓ Great work!':'↷ Moved to end of plan.'}</span>
          `}
          <span class="sync-msg" id="sync-msg" style="margin-left:auto"></span>
        </div>
      </div>
      ${buildUpcoming(planId)}
    </div>`;
}

function buildUpcoming(planId) {
  const plan = PLAN_REGISTRY[planId];
  if (!plan) return '';
  const dates = getEffectiveDatesForPlan(planId);
  const pending = plan.sessions.filter(m=>!state[stateKey(planId,m.id)]?.status||state[stateKey(planId,m.id)]?.status==='pending');
  const skipped = plan.sessions.filter(m=>state[stateKey(planId,m.id)]?.status==='skipped');
  if(!pending.length&&!skipped.length) return `<div class="upcoming"><div class="upcoming-title">🎉 ${plan.name} complete! Activate your next plan.</div></div>`;
  const finalDate = [...pending,...skipped].reduce((last,m)=>{ const d=dates[m.id]; return d&&d>last?d:last; }, new Date(0));
  return `<div class="upcoming">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 11px;flex:1;min-width:80px">
        <div style="font-size:10px;color:var(--text3);margin-bottom:1px">Pending</div>
        <div style="font-size:15px;font-weight:700;color:var(--accent)">${pending.length}</div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 11px;flex:1;min-width:80px">
        <div style="font-size:10px;color:var(--text3);margin-bottom:1px">Skipped</div>
        <div style="font-size:15px;font-weight:700;color:var(--yellow)">${skipped.length}</div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 11px;flex:1;min-width:80px">
        <div style="font-size:10px;color:var(--text3);margin-bottom:1px">Est. finish</div>
        <div style="font-size:12px;font-weight:700;color:var(--green)">${finalDate.getTime()>0?finalDate.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'—'}</div>
      </div>
    </div>
    <div class="upcoming-title">Next sessions</div>
    ${pending.slice(0,4).map(m=>{
      const d=dates[m.id], today=new Date().toDateString(), isToday=d&&d.toDateString()===today;
      return `<div class="ucard" onclick="selectSession('${stateKey(planId,m.id)}')">
        <div>
          <div class="ucard-date">${d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):''} · 3:00 PM</div>
          <div class="ucard-name">Day ${m.id}: ${m.title}</div>
        </div>
        <span class="utag ${isToday?'utag-today':'utag-ok'}">${isToday?'Today':'On track'}</span>
      </div>`;
    }).join('')}
    ${skipped.length?`<div class="upcoming-title" style="margin-top:10px">Skipped — at end of plan</div>
    ${skipped.map(m=>{const d=dates[m.id],reason=state[stateKey(planId,m.id)]?.note;
      return `<div class="ucard" onclick="selectSession('${stateKey(planId,m.id)}')" style="opacity:.7">
        <div>
          <div class="ucard-date">${d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):''} · rescheduled</div>
          <div class="ucard-name">Day ${m.id}: ${m.title}</div>
          ${reason?`<div style="font-size:10px;color:var(--text3);margin-top:2px">Reason: ${reason}</div>`:''}
        </div><span class="utag utag-rs">↷ Skipped</span>
      </div>`;}).join('')}` : ''}
  </div>`;
}

async function markSession(sk, status, note) {
  note = note !== undefined ? note : (document.getElementById('note-input')?.value||'');
  setSyncState('syncing');
  try {
    let res;
    if (status==='pending') { res=await apiDelete(sk); if(res.success) delete state[sk]; }
    else { res=await apiSave(sk,status,note); if(res.success) state[sk]={status,note,updatedAt:new Date().toISOString()}; }
    if(!res.success) throw new Error(res.error);
    setSyncState('synced');
    updateGlobalStats(); renderProgress(); renderCalendar(); renderSList();
    if(status!=='pending') renderSessionDetail(); else renderDashboard();
    showToast(status==='completed'?'✅ Saved! Schedule updated.':status==='skipped'?'↷ Skipped — moved to end of plan.':'↩ Reset to pending.');
    renderTabs();
  } catch(e) { setSyncState('error'); showToast('❌ Sync failed. Check your connection.'); }
}

async function markMultiple(keys) {
  const note = document.getElementById('note-input')?.value||'';
  setSyncState('syncing');
  let allOk=true;
  for(const sk of keys) {
    const n = sk===keys[0]?note:'';
    try { const res=await apiSave(sk,'completed',n); if(res.success) state[sk]={status:'completed',note:n,updatedAt:new Date().toISOString()}; else allOk=false; }
    catch { allOk=false; }
  }
  setSyncState(allOk?'synced':'error');
  updateGlobalStats(); renderProgress(); renderCalendar(); renderSList(); renderTabs();
  const [planId] = keys[0].split(':');
  const nextPending = PLAN_REGISTRY[planId]?.sessions.find(m=>!state[stateKey(planId,m.id)]?.status||state[stateKey(planId,m.id)]?.status==='pending');
  if(nextPending) selectSession(stateKey(planId,nextPending.id)); else renderDashboard();
  showToast(allOk?`⚡ ${keys.length} sessions done! Schedule pulled forward.`:'⚠️ Some failed — check connection.');
}

function confirmSkip(sk) {
  const [planId,mid] = sk.split(':');
  const m = PLAN_REGISTRY[planId]?.sessions.find(x=>x.id===+mid);
  const modal=document.createElement('div'); modal.className='modal-bg'; modal.id='skip-modal';
  modal.innerHTML=`<div class="modal">
    <div class="modal-title">↷ Skip this session?</div>
    <div class="modal-body">"<strong>${m?.title}</strong>" will be moved to the end of the plan and the schedule adjusts automatically.</div>
    <div class="modal-label">Reason (optional)</div>
    <input class="modal-input" id="skip-reason" placeholder="e.g. busy with work, will catch up Friday…"/>
    <div class="modal-actions">
      <button class="btn btn-undo" onclick="closeModal()">Cancel</button>
      <button class="btn btn-skip" onclick="doSkip('${sk}')">↷ Confirm Skip</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById('skip-reason').focus();
}

async function doSkip(sk) {
  const reason=document.getElementById('skip-reason')?.value||'';
  closeModal(); await markSession(sk,'skipped',reason);
}

let prevUnlocked = new Set();

function computeStats() {
  // Streak
  const allDates = [];
  enabledPlans.forEach(pid => {
    const plan = PLAN_REGISTRY[pid];
    if(!plan) return;
    plan.sessions.forEach(m => {
      const s = state[stateKey(pid,m.id)];
      if(s?.status==='completed' && s.updatedAt) allDates.push(new Date(s.updatedAt));
    });
  });
  allDates.sort((a,b)=>b-a);
  let streak=0, check=new Date(); check.setHours(0,0,0,0);
  for(const d of allDates) {
    const cd=new Date(d); cd.setHours(0,0,0,0);
    if(Math.abs(check-cd)<=86400000){streak++;check=cd;check.setDate(check.getDate()-1);}else break;
  }

  // Total done
  let totalDone=0;
  const planDone={};
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid];
    if(!plan) return;
    const done=plan.sessions.filter(m=>state[stateKey(pid,m.id)]?.status==='completed').length;
    planDone[pid]=done;
    totalDone+=done;
  });

  // Max plan pct
  let maxPlanPct=0;
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid];
    if(!plan) return;
    const pct=Math.round((planDone[pid]/plan.sessions.length)*100);
    if(pct>maxPlanPct) maxPlanPct=pct;
  });

  // Recovered skips (skipped then completed)
  // Can't track this easily without history; use skipped count > 0 && done > 0 as proxy
  const recoveredSkips = enabledPlans.reduce((sum,pid)=>{
    const plan=PLAN_REGISTRY[pid];
    if(!plan) return sum;
    return sum + plan.sessions.filter(m=>state[stateKey(pid,m.id)]?.status==='skipped').length;
  },0);

  // Max sessions completed in a single day
  const dayMap={};
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid];
    if(!plan) return;
    plan.sessions.forEach(m=>{
      const s=state[stateKey(pid,m.id)];
      if(s?.status==='completed'&&s.updatedAt){
        const dk=new Date(s.updatedAt).toDateString();
        dayMap[dk]=(dayMap[dk]||0)+1;
      }
    });
  });
  const maxDayDone=Math.max(0,...Object.values(dayMap));

  // Perfect weeks (Mon-Fri all done, none skipped in that week)
  const weekMap={};
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid];
    if(!plan) return;
    plan.sessions.forEach(m=>{
      const s=state[stateKey(pid,m.id)];
      if(s?.status==='completed'&&s.updatedAt){
        const d=new Date(s.updatedAt);
        const wk=`${d.getFullYear()}-W${Math.ceil(d.getDate()/7)}`;
        weekMap[wk]=(weekMap[wk]||0)+1;
      }
    });
  });
  const perfectWeeks=Object.values(weekMap).filter(v=>v>=5).length;

  return { streak, totalDone, planDone, maxPlanPct, recoveredSkips, maxDayDone, perfectWeeks, enabledCount:enabledPlans.length };
}

function checkAchievements(silent=false) {
  const stats = computeStats();
  const nowUnlocked = new Set();
  ACHIEVEMENTS.forEach(ach => {
    if(ach.check(stats)) nowUnlocked.add(ach.id);
  });
  if(!silent) {
    nowUnlocked.forEach(id => {
      if(!prevUnlocked.has(id)) {
        const ach = ACHIEVEMENTS.find(a=>a.id===id);
        if(ach) showAchievementPopup(ach);
      }
    });
  }
  prevUnlocked = nowUnlocked;
  return nowUnlocked;
}

function showAchievementPopup(ach) {
  document.getElementById('ach-popup-icon').textContent = ach.icon;
  document.getElementById('ach-popup-name').textContent = ach.name;

}

function renderFullDashboard() {
  const el = document.getElementById('full-dashboard');
  if(!el) return;
  const stats = computeStats();
  const unlocked = checkAchievements(true);
  const quote = QUOTES[Math.floor(Date.now()/86400000) % QUOTES.length];
  const greeting = GREETINGS[stats.streak % GREETINGS.length];

  // Plan summary data
  const planRows = enabledPlans.map(pid=>{
    const plan=PLAN_REGISTRY[pid];
    if(!plan) return null;
    const done=plan.sessions.filter(m=>state[stateKey(pid,m.id)]?.status==='completed').length;
    const skipped=plan.sessions.filter(m=>state[stateKey(pid,m.id)]?.status==='skipped').length;
    const pending=plan.sessions.length-done-skipped;
    return {pid,plan,done,skipped,pending,total:plan.sessions.length};
  }).filter(Boolean);

  // Total across all plans
  const totDone=planRows.reduce((s,r)=>s+r.done,0);
  const totSkip=planRows.reduce((s,r)=>s+r.skipped,0);
  const totPend=planRows.reduce((s,r)=>s+r.pending,0);
  const totAll=planRows.reduce((s,r)=>s+r.total,0);

  // This week sessions
  const todayDate = new Date(); todayDate.setHours(0,0,0,0);
  const mon = new Date(todayDate); mon.setDate(todayDate.getDate()-todayDate.getDay()+1);
  const weekDays = Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });

  const weekSessions = weekDays.map(day=>{
    let session=null;
    enabledPlans.forEach(pid=>{
      if(session) return;
      const plan=PLAN_REGISTRY[pid]; if(!plan) return;
      const dates=getEffectiveDatesForPlan(pid);
      plan.sessions.forEach(m=>{
        if(session) return;
        const d=dates[m.id];
        if(d && d.toDateString()===day.toDateString()) session={m,pid,status:state[stateKey(pid,m.id)]?.status||'pending'};
      });
    });
    return {day,session};
  });

  // Estimate finish date
  let finishDate = '—';
  const lastPlan = enabledPlans[enabledPlans.length-1];
  if(lastPlan){
    const dates=getEffectiveDatesForPlan(lastPlan);
    const plan=PLAN_REGISTRY[lastPlan];
    if(plan){
      const lastM=plan.sessions[plan.sessions.length-1];
      if(dates[lastM.id]) finishDate=dates[lastM.id].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    }
  }

  el.innerHTML = `
    <!-- HERO -->
    <div class="hero-banner">
      <div class="hero-left">
        <div class="hero-greeting">${greeting}</div>
        <div class="hero-quote">"${quote.text}"<br><span style="font-size:11px;color:var(--text3);font-style:normal">— ${quote.author}</span></div>
      </div>
      <div class="hero-right">
        <div class="hero-streak">${stats.streak}</div>
        <div class="hero-streak-lbl">🔥 Day Streak</div>
      </div>
    </div>

    <!-- KPI ROW -->
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-icon">✅</div><div class="kpi-val" style="color:var(--green)">${totDone}</div><div class="kpi-lbl">Sessions Done</div><div class="kpi-sub">of ${totAll} total</div></div>
      <div class="kpi-card"><div class="kpi-icon">⏳</div><div class="kpi-val" style="color:var(--accent)">${totPend}</div><div class="kpi-lbl">Remaining</div><div class="kpi-sub">across all plans</div></div>
      <div class="kpi-card"><div class="kpi-icon">↷</div><div class="kpi-val" style="color:var(--yellow)">${totSkip}</div><div class="kpi-lbl">Skipped</div><div class="kpi-sub">rescheduled at end</div></div>
      <div class="kpi-card"><div class="kpi-icon">🏆</div><div class="kpi-val" style="color:var(--purple)">${unlocked.size}</div><div class="kpi-lbl">Achievements</div><div class="kpi-sub">of ${ACHIEVEMENTS.length} total</div></div>
      <div class="kpi-card"><div class="kpi-icon">📅</div><div class="kpi-val" style="color:var(--text);font-size:14px">${finishDate}</div><div class="kpi-lbl">Est. Finish</div><div class="kpi-sub">all plans complete</div></div>
    </div>

    <!-- CHARTS -->
    <div class="charts-grid">
      <!-- DONUT: overall status -->
      <div class="chart-card">
        <div class="chart-title">📊 Overall Progress <span class="chart-sub">all plans</span></div>
        <div class="donut-wrap">
          <canvas id="donut-chart" width="130" height="130" class="donut-canvas"></canvas>
          <div class="donut-legend">
            <div class="donut-item"><div class="donut-dot" style="background:var(--green)"></div>Completed<div class="donut-val">${totDone}</div></div>
            <div class="donut-item"><div class="donut-dot" style="background:var(--accent)"></div>Pending<div class="donut-val">${totPend}</div></div>
            <div class="donut-item"><div class="donut-dot" style="background:var(--yellow)"></div>Skipped<div class="donut-val">${totSkip}</div></div>
          </div>
        </div>
      </div>

      <!-- BAR: per plan progress -->
      <div class="chart-card">
        <div class="chart-title">📚 Progress by Plan</div>
        <canvas id="bar-chart" height="130"></canvas>
      </div>

      <!-- HEATMAP: activity last 26 weeks -->
      <div class="chart-card full">
        <div class="chart-title">🗓️ Activity Heatmap <span class="chart-sub">last 6 months</span></div>
        <div id="heatmap-container"></div>
        <div class="hm-legend">
          <div class="hm-leg"><div class="hm-leg-box" style="background:var(--border)"></div>No session</div>
          <div class="hm-leg"><div class="hm-leg-box" style="background:var(--green)"></div>Completed</div>
          <div class="hm-leg"><div class="hm-leg-box" style="background:var(--yellow)"></div>Skipped</div>
        </div>
      </div>
    </div>

    <!-- THIS WEEK -->
    <div class="week-plan">
      <div class="week-plan-title">📅 This Week's Schedule</div>
      <div class="week-days">
        ${weekDays.map((day,i)=>{
          const isToday = day.toDateString()===new Date().toDateString();
          const entry = weekSessions[i];
          const s = entry?.session;
          const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
          const colClass = isToday?'today-col':s?.status==='completed'?'done-col':s?.status==='skipped'?'skip-col':'';
          const isWeekend = day.getDay()===0||day.getDay()===6;
          return `<div class="week-day ${colClass}">
            <div class="wd-name">${dayNames[day.getDay()]}</div>
            <div class="wd-date" style="${isToday?'color:var(--accent)':''}">${day.getDate()}</div>
            <div class="wd-session">${isWeekend?'<span style="color:var(--text3)">Rest day</span>':s?`${PLAN_REGISTRY[s.pid]?.icon||''} Day ${s.m.id}`:'<span style="color:var(--text3)">—</span>'}</div>
            <div class="wd-status">${s?.status==='completed'?'<span style="color:var(--green)">✓</span>':s?.status==='skipped'?'<span style="color:var(--yellow)">↷</span>':isWeekend?'':s?'<span style="color:var(--accent)">○</span>':''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- ACHIEVEMENTS -->
    <div class="achievements-section">
      <div class="ach-title">🏆 Achievements <span style="font-size:11px;color:var(--text2);font-weight:400">${unlocked.size} of ${ACHIEVEMENTS.length} unlocked</span></div>
      <div class="ach-grid">
        ${ACHIEVEMENTS.map(ach=>{
          const isUnlocked = unlocked.has(ach.id);
          const isNew = isUnlocked && !prevUnlocked.has(ach.id);
          // compute progress for locked achievements
          const achStats = computeStats();
          let progress=0, progressMax=1;
          if(ach.id==='day3'){progress=Math.min(achStats.streak,3);progressMax=3;}
          else if(ach.id==='week1'){progress=Math.min(achStats.totalDone,5);progressMax=5;}
          else if(ach.id==='day7'){progress=Math.min(achStats.streak,7);progressMax=7;}
          else if(ach.id==='halfway'){progress=Math.min(achStats.maxPlanPct,50);progressMax=50;}
          else if(ach.id==='day14'){progress=Math.min(achStats.streak,14);progressMax=14;}
          else if(ach.id==='day30'){progress=Math.min(achStats.streak,30);progressMax=30;}
          else if(ach.id==='century'){progress=Math.min(achStats.totalDone,100);progressMax=100;}
          else if(ach.id==='speedrun'){progress=Math.min(achStats.maxDayDone,3);progressMax=3;}
          else if(ach.id==='gcp_done'){progress=Math.min(achStats.planDone['gcp']||0,22);progressMax=22;}
          else if(ach.id==='two_plans'){progress=Object.values(achStats.planDone).filter(v=>v>0).length;progressMax=2;}
          else if(ach.id==='all_plans'){progress=achStats.enabledCount;progressMax=7;}
          else{progress=isUnlocked?1:0;progressMax=1;}
          const pct=Math.round((progress/progressMax)*100);
          return `<div class="ach-card ${isUnlocked?'unlocked':'locked'}">
            ${isNew?'<div class="new-badge">NEW!</div>':''}
            ${isUnlocked?'<div class="ach-unlocked-badge">✓</div>':''}
            <div class="ach-icon">${ach.icon}</div>
            <div class="ach-name">${ach.name}</div>
            <div class="ach-desc">${ach.desc}</div>
            ${!isUnlocked?`<div class="ach-progress-bar"><div class="ach-progress-fill" style="width:${pct}%"></div></div>
            <div style="font-size:9px;color:var(--text3);margin-top:3px">${progress}/${progressMax}</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>
  `;

  // Draw charts after DOM is ready
  requestAnimationFrame(()=>{
    drawDonut(totDone, totPend, totSkip);
    drawBar(planRows);
    drawHeatmap();
  });
}

// ── DONUT CHART ────────────────────────────────────────────────────────────
function drawDonut(done, pending, skipped) {
  const canvas = document.getElementById('donut-chart');
  if(!canvas) return;

  const dpr = window.devicePixelRatio || 1;
  const SIZE = 140; // logical px
  canvas.width  = SIZE * dpr;
  canvas.height = SIZE * dpr;
  canvas.style.width  = SIZE + 'px';
  canvas.style.height = SIZE + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const total = done + pending + skipped || 1;
  const cx = SIZE/2, cy = SIZE/2, r = 58, iR = 38;

  const data = [
    { val: done,    color: '#1fcc6e' },
    { val: pending, color: '#3d7fff' },
    { val: skipped, color: '#f5a623' },
  ];

  ctx.clearRect(0, 0, SIZE, SIZE);

  // Draw segments with small gap between them
  let angle = -Math.PI / 2;
  const GAP = total === 0 ? 0 : 0.03;
  data.forEach(d => {
    if (d.val === 0) return;
    const slice = (d.val / total) * 2 * Math.PI - GAP;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, angle + GAP/2, angle + GAP/2 + slice);
    ctx.closePath();
    ctx.fillStyle = d.color;
    ctx.fill();
    angle += (d.val / total) * 2 * Math.PI;
  });

  // If nothing done yet — draw full pending circle
  if (done === 0 && skipped === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.fillStyle = '#3d7fff';
    ctx.fill();
  }

  // Inner hole (crisp)
  ctx.beginPath();
  ctx.arc(cx, cy, iR, 0, 2 * Math.PI);
  ctx.fillStyle = '#131729';
  ctx.fill();

  // Center text — crisp
  const pct = Math.round((done / total) * 100);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#dce3f5';
  ctx.font = `bold ${iR * 0.7}px Inter, system-ui, sans-serif`;
  ctx.fillText(pct + '%', cx, cy - 6);

  ctx.fillStyle = '#7b87b0';
  ctx.font = `${iR * 0.35}px Inter, system-ui, sans-serif`;
  ctx.fillText('done', cx, cy + 10);
}

// ── BAR CHART ──────────────────────────────────────────────────────────────
function drawBar(planRows) {
  const canvas = document.getElementById('bar-chart');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth || 300, H = 140;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,W,H);

  if(!planRows.length) return;
  const barW = Math.min(40, (W-40)/planRows.length - 10);
  const gap = (W-40-barW*planRows.length)/(planRows.length+1);
  const maxH = H-30;

  planRows.forEach((row,i)=>{
    const x = 20+gap+(barW+gap)*i;
    const donePct = row.done/row.total;
    const skipPct = row.skipped/row.total;
    // pending bg
    ctx.fillStyle='#252d4a';
    ctx.roundRect(x,10,barW,maxH,3); ctx.fill();
    // done bar
    const doneH=donePct*maxH;
    ctx.fillStyle=row.plan.color+'cc';
    ctx.beginPath(); ctx.roundRect(x,10+maxH-doneH,barW,doneH,3); ctx.fill();
    // skip overlay
    if(row.skipped>0){
      const skipH=skipPct*maxH;
      ctx.fillStyle='#f5a623aa';
      ctx.fillRect(x,10+maxH-doneH-skipH,barW,skipH);
    }
    // label
    ctx.fillStyle='#7b87b0'; ctx.font='9px Inter,sans-serif'; ctx.textAlign='center';
    ctx.fillText(row.plan.icon,x+barW/2,H-12);
    ctx.fillStyle='#dce3f5'; ctx.font='bold 10px Inter,sans-serif';
    ctx.fillText(row.done,x+barW/2,H-2);
  });
}

// ── HEATMAP ────────────────────────────────────────────────────────────────
function drawHeatmap() {
  const container = document.getElementById('heatmap-container');
  if(!container) return;

  // Build map of date → status
  const dateMap = {};
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid]; if(!plan) return;
    plan.sessions.forEach(m=>{
      const s=state[stateKey(pid,m.id)];
      if(s?.updatedAt && (s.status==='completed'||s.status==='skipped')){
        const dk=new Date(s.updatedAt).toDateString();
        dateMap[dk]=s.status;
      }
    });
  });

  // Also add scheduled pending dates
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid]; if(!plan) return;
    const dates=getEffectiveDatesForPlan(pid);
    plan.sessions.forEach(m=>{
      const s=state[stateKey(pid,m.id)];
      const status=s?.status||'pending';
      if(status==='pending'&&dates[m.id]){
        const dk=dates[m.id].toDateString();
        if(!dateMap[dk]) dateMap[dk]='scheduled';
      }
    });
  });

  // Generate 26 weeks of cells (Mon-Sun)
  const today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(today); start.setDate(start.getDate()-7*25);
  // align to Monday
  while(start.getDay()!==1) start.setDate(start.getDate()-1);

  const cells=[]; const monthLabels=[];
  let cur=new Date(start), lastMonth=-1;
  for(let w=0;w<26;w++){
    let mlabel='';
    for(let d=0;d<7;d++){
      if(cur.getMonth()!==lastMonth&&cur.getDay()===1){mlabel=cur.toLocaleDateString('en-US',{month:'short'});lastMonth=cur.getMonth();}
      cells.push({date:new Date(cur),status:dateMap[cur.toDateString()]||'none',isToday:cur.toDateString()===today.toDateString()});
      cur.setDate(cur.getDate()+1);
    }
    monthLabels.push(mlabel||'');
  }

  // Render: 26 cols (weeks), 7 rows (days)
  // Transpose: we go week by week
  const weeks=[];
  for(let w=0;w<26;w++) weeks.push(cells.slice(w*7,(w+1)*7));

  container.innerHTML=`
    <div class="hm-months">${monthLabels.map(l=>`<div class="hm-month-lbl">${l}</div>`).join('')}</div>
    <div style="display:flex;gap:2px">
      <div style="display:grid;grid-template-rows:repeat(7,1fr);gap:2px;margin-right:2px">
        ${['M','T','W','T','F','S','S'].map(d=>`<div style="font-size:8px;color:var(--text3);height:10px;line-height:10px">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(26,1fr);grid-template-rows:repeat(7,10px);gap:2px;flex:1">
        ${weeks.map(week=>week.map(cell=>{
          const bg=cell.status==='completed'?'var(--green)':cell.status==='skipped'?'var(--yellow)':cell.status==='scheduled'?'rgba(61,127,255,.25)':'var(--border)';
          const title=`${cell.date.toLocaleDateString('en-US',{month:'short',day:'numeric'})}: ${cell.status}`;
          return `<div class="hm-cell${cell.isToday?' today':''}" style="background:${bg}" title="${title}"></div>`;
        }).join('')).join('')}
      </div>
    </div>`;
}

// Override init to show dashboard first and check achievements
const _origInit = init;
function init() {
  _origInit();
  // Start on dashboard view
  document.getElementById('prog-wrap').style.display='none';
  document.getElementById('app-main').style.display='none';
  document.getElementById('plan-tabs-bar').style.display='none';
  currentView='plans'; // reset so switchView works correctly
  switchView('dashboard');
  // Check achievements silently on load
  prevUnlocked = checkAchievements(true);
}

// Override markSession to check achievements after every action
const _origMark = markSession;
async function markSession(sk, status, note) {
  await _origMark(sk, status, note);
  checkAchievements(false); // will popup new ones
  if(currentView==='dashboard') renderFullDashboard();
}

// Override markMultiple similarly
const _origMulti = markMultiple;
async function markMultiple(keys) {
  await _origMulti(keys);
  checkAchievements(false);
  if(currentView==='dashboard') renderFullDashboard();
}
