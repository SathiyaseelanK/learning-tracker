<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Daily Learning Habit</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="theme-color" content="#3d7fff"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Learning"/>
<style>
:root{
  --bg:#0b0e1a;--surface:#131729;--surface2:#1c2138;--border:#252d4a;--border2:#2e3a5c;
  --accent:#3d7fff;--accent2:#6c4ff6;--green:#1fcc6e;--yellow:#f5a623;--red:#f04e4e;--purple:#a855f7;
  --text:#dce3f5;--text2:#7b87b0;--text3:#404870;--font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:36px;width:100%;max-width:360px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.login-logo{font-size:40px;margin-bottom:8px;text-align:center}
.login-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px;line-height:1.5}
.lbl{font-size:11px;color:var(--text2);margin-bottom:5px}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:12px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:4px}
.login-btn:hover{opacity:.88}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{font-size:12px;color:var(--red);margin-top:8px;min-height:16px;text-align:center}
.login-spinner{display:none;font-size:12px;color:var(--text2);margin-top:8px;text-align:center}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:12px}
.spin{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh;padding-bottom:70px}

/* ── TOP BAR ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.topbar-logo{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar-logo span{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-right{display:flex;align-items:center;gap:10px}
.streak-pill{background:linear-gradient(135deg,rgba(245,166,35,.2),rgba(240,78,78,.15));border:1px solid rgba(245,166,35,.3);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--yellow);display:flex;align-items:center;gap:5px}
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:14px}
.user-pill{background:var(--surface2);border:1px solid var(--border2);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:6px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.sync-dot.syncing{background:var(--yellow);animation:pulse 1s infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:20;height:60px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text3);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;border:none;background:none;transition:color .15s;padding:8px 4px}
.nav-item.active{color:var(--accent)}
.nav-item-icon{font-size:20px;line-height:1}

/* ── VIEWS ── */
.view{display:none;padding:16px 20px;max-width:720px;margin:0 auto}
.view.active{display:block}

/* ── TODAY VIEW ── */
.today-date{font-size:13px;color:var(--text2);margin-bottom:4px}
.today-heading{font-size:22px;font-weight:800;margin-bottom:6px}
.today-sub{font-size:13px;color:var(--text2);margin-bottom:20px}

/* HABIT CHECK-IN CARD */
.habit-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .2s}
.habit-card.done{border-color:var(--green);background:rgba(31,204,110,.04)}
.habit-card.skipped{border-color:var(--yellow);opacity:.7}
.habit-card-head{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.habit-icon{font-size:26px;flex-shrink:0}
.habit-info{flex:1;min-width:0}
.habit-name{font-size:14px;font-weight:600;line-height:1.3}
.habit-meta{font-size:11px;color:var(--text2);margin-top:2px}
.habit-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .2s}
.habit-card.done .habit-check{background:var(--green);border-color:var(--green);color:#000}
.habit-card.skipped .habit-check{background:var(--yellow);border-color:var(--yellow);color:#000}
.habit-actions{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
.habit-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.habit-btn.complete{background:var(--green);color:#000}
.habit-btn.skip{background:var(--surface2);border:1px solid var(--border2);color:var(--text2)}
.habit-btn.undo{background:var(--surface2);border:1px solid var(--border2);color:var(--text2)}
.habit-btn.open{background:var(--accent);color:#fff}
.habit-btn:hover{opacity:.85}
.habit-note-wrap{padding:0 16px 14px}
.habit-note{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;resize:none;min-height:52px;outline:none;font-family:var(--font);transition:border-color .15s}
.habit-note:focus{border-color:var(--accent)}

/* DAY SUMMARY BAR */
.day-summary{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.day-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;flex:1;min-width:80px;text-align:center}
.day-stat-v{font-size:20px;font-weight:800;line-height:1}
.day-stat-l{font-size:10px;color:var(--text2);margin-top:3px}

/* MOTIVATIONAL QUOTE STRIP */
.quote-strip{background:linear-gradient(135deg,rgba(61,127,255,.1),rgba(108,79,246,.08));border:1px solid rgba(61,127,255,.2);border-radius:12px;padding:14px 16px;margin-bottom:18px;position:relative}
.quote-strip-cat{font-size:10px;color:var(--accent2);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.quote-strip-text{font-size:13px;font-style:italic;color:var(--text);line-height:1.7}
.quote-strip-author{font-size:11px;color:var(--text3);margin-top:5px}
.quote-strip-actions{display:flex;gap:6px;margin-top:10px}
.quote-action-btn{background:none;border:1px solid var(--border2);border-radius:6px;padding:3px 10px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .15s}
.quote-action-btn:hover{border-color:var(--accent);color:var(--accent)}
.quote-action-btn.saved{border-color:var(--red);color:var(--red)}

/* WEEKLY HABIT GRID */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}
.week-day-col{text-align:center}
.week-day-name{font-size:9px;color:var(--text3);font-weight:600;margin-bottom:5px}
.week-day-date{font-size:11px;font-weight:600;margin-bottom:4px}
.week-day-dot{width:28px;height:28px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:11px}
.wdd-done{background:var(--green);color:#000;font-weight:700}
.wdd-partial{background:var(--yellow);color:#000}
.wdd-missed{background:var(--border);color:var(--text3)}
.wdd-today{background:var(--accent);color:#fff;font-weight:700}
.wdd-future{background:var(--border);color:var(--text3);opacity:.4}
.wdd-rest{background:transparent;color:var(--text3);font-size:9px}

/* ── DASHBOARD VIEW ── */
.dash-section{margin-bottom:24px}
.dash-section-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* STREAK HERO */
.streak-hero{background:linear-gradient(135deg,rgba(245,166,35,.15),rgba(240,78,78,.1));border:1px solid rgba(245,166,35,.25);border-radius:16px;padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
.streak-fire{font-size:52px;flex-shrink:0;filter:drop-shadow(0 0 12px rgba(245,166,35,.5))}
.streak-info{flex:1}
.streak-count{font-size:36px;font-weight:800;color:var(--yellow);line-height:1}
.streak-label{font-size:13px;color:var(--text2);margin-top:2px}
.streak-best{font-size:11px;color:var(--text3);margin-top:4px}

/* XP BAR */
.xp-bar-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;cursor:pointer}
.xp-bar-card:hover{border-color:var(--border2)}
.xp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.xp-level{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.xp-points{font-size:12px;font-weight:700;color:var(--accent)}
.xp-bar{height:7px;background:var(--border);border-radius:99px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .6s}
.xp-next{font-size:10px;color:var(--text3);margin-top:4px}

/* MINI STATS */
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.mini-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.mini-stat-v{font-size:22px;font-weight:800;line-height:1}
.mini-stat-l{font-size:10px;color:var(--text2);margin-top:3px}

/* HABIT HEATMAP */
.heatmap-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;overflow-x:auto}
.heatmap-grid{display:grid;grid-template-columns:repeat(52,10px);grid-template-rows:repeat(7,10px);gap:2px;min-width:600px}
.hm-cell{width:10px;height:10px;border-radius:2px;background:var(--border)}
.hm-cell.hm-done{background:var(--green)}
.hm-cell.hm-partial{background:var(--yellow)}
.hm-cell.hm-today{box-shadow:0 0 0 1.5px var(--accent)}
.hm-legend{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.hm-leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2)}
.hm-leg-box{width:9px;height:9px;border-radius:2px}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ach-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;transition:transform .15s}
.ach-card.unlocked{border-color:rgba(61,127,255,.4);background:rgba(61,127,255,.05)}
.ach-card.locked{opacity:.4;filter:grayscale(.7)}
.ach-icon{font-size:28px;margin-bottom:5px}
.ach-name{font-size:11px;font-weight:700;margin-bottom:2px}
.ach-desc{font-size:10px;color:var(--text2);line-height:1.4}
.ach-prog{height:3px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
.ach-prog-fill{height:100%;background:var(--accent);border-radius:99px}

/* ── PLANS VIEW ── */
.plan-tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.plan-tab-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;background:var(--surface);border:1px solid var(--border);transition:all .15s;flex-shrink:0}
.plan-tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.session-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:border-color .15s;display:flex;align-items:center;gap:12px}
.session-item:hover{border-color:var(--border2)}
.session-item.active{border-color:var(--accent);background:rgba(61,127,255,.06)}
.session-num{font-size:11px;font-weight:700;color:var(--text3);min-width:28px}
.session-info{flex:1;min-width:0}
.session-title{font-size:13px;font-weight:500;line-height:1.3}
.session-date{font-size:10px;color:var(--text3);margin-top:2px}
.session-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ssd-done{background:var(--green)}
.ssd-skip{background:var(--yellow)}
.ssd-pending{background:var(--border2)}
.ssd-today{background:var(--accent)}
.search-inp{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 14px;font-size:13px;outline:none;margin-bottom:12px;transition:border-color .15s}
.search-inp:focus{border-color:var(--accent)}

/* SESSION DETAIL */
.session-detail-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.sdc-head{padding:16px 18px;border-bottom:1px solid var(--border)}
.sdc-plan{font-size:11px;color:var(--text2);margin-bottom:4px}
.sdc-title{font-size:17px;font-weight:700;line-height:1.3;margin-bottom:4px}
.sdc-date{font-size:12px;color:var(--accent)}
.sdc-body{padding:16px 18px}
.tip-box{background:rgba(61,127,255,.06);border:1px solid rgba(61,127,255,.15);border-radius:8px;padding:10px 13px;margin-bottom:14px}
.tip-lbl{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.4px;margin-bottom:3px}
.tip-txt{font-size:12px;color:var(--text2);line-height:1.7}
.topics-lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.4px;margin-bottom:7px}
.topic-row{display:flex;gap:9px;padding:9px 11px;background:var(--surface2);border-radius:8px;margin-bottom:4px}
.topic-n{font-size:10px;font-weight:700;color:var(--accent2);min-width:16px;flex-shrink:0;margin-top:1px}
.topic-t{font-size:12px;line-height:1.6;color:var(--text)}
.guide-block{background:var(--surface2);border:1px solid var(--border);border-radius:9px;margin-bottom:6px;overflow:hidden;margin-top:14px}
.guide-hd{padding:9px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.guide-hd:hover{background:rgba(255,255,255,.03)}
.guide-topic{font-size:12px;font-weight:600}
.guide-arrow{font-size:11px;color:var(--text3);transition:transform .2s}
.guide-arrow.open{transform:rotate(180deg)}
.guide-steps{padding:0 13px 10px;display:none}
.guide-steps.open{display:block}
.guide-step{display:flex;gap:8px;margin-bottom:7px;align-items:flex-start}
.step-n{font-size:10px;font-weight:700;color:var(--accent2);background:rgba(108,79,246,.15);border-radius:4px;padding:2px 6px;flex-shrink:0;margin-top:1px;white-space:nowrap}
.step-t{font-size:12px;color:var(--text2);line-height:1.6}
.step-t a{color:var(--accent);text-decoration:none}
.step-t a:hover{text-decoration:underline}
.note-lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.4px;margin-bottom:5px;margin-top:14px}
.note-ta{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:9px 11px;font-size:12px;resize:vertical;min-height:60px;outline:none;font-family:var(--font);transition:border-color .15s}
.note-ta:focus{border-color:var(--accent)}
.sdc-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface2);align-items:center}
.btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-green{background:var(--green);color:#000}
.btn-yellow{background:var(--yellow);color:#000}
.btn-ghost{background:var(--surface);border:1px solid var(--border2);color:var(--text2)}
.btn-accent{background:var(--accent);color:#fff}
.btn-grad{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.sync-lbl{font-size:11px;color:var(--text3);margin-left:auto}
.impact-ok{font-size:12px;background:rgba(31,204,110,.07);border:1px solid rgba(31,204,110,.2);color:var(--green);border-radius:8px;padding:8px 12px;margin-bottom:12px;line-height:1.5}
.impact-warn{font-size:12px;background:rgba(245,166,35,.07);border:1px solid rgba(245,166,35,.2);color:var(--yellow);border-radius:8px;padding:8px 12px;margin-bottom:12px;line-height:1.5}

/* ── QUOTES VIEW ── */
.quote-card-big{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:12px}
.qcb-cat{font-size:10px;color:var(--accent2);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px}
.qcb-text{font-size:16px;font-style:italic;line-height:1.8;margin-bottom:10px;color:var(--text)}
.qcb-author{font-size:12px;color:var(--text3)}
.qcb-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.q-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.q-btn-save{background:rgba(240,78,78,.12);border:1px solid rgba(240,78,78,.25);color:var(--red)}
.q-btn-saved{background:rgba(240,78,78,.2);border:1px solid var(--red);color:var(--red)}
.q-btn-shuffle{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.q-btn-share{background:rgba(61,127,255,.1);border:1px solid rgba(61,127,255,.25);color:var(--accent)}
.cat-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cat-chip{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:500;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--text2);transition:all .15s}
.cat-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.saved-quote-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px}
.sqi-cat{font-size:10px;color:var(--accent2);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:5px}
.sqi-text{font-size:13px;font-style:italic;color:var(--text);line-height:1.7;margin-bottom:5px}
.sqi-author{font-size:11px;color:var(--text3)}
.sqi-actions{display:flex;gap:6px;margin-top:10px}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px 18px 0 0;padding:24px;width:100%;max-height:90vh;overflow-y:auto}
@media(min-width:600px){.modal{border-radius:16px;max-width:460px;width:92%}}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-inp{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;outline:none}
.modal-inp:focus{border-color:var(--accent)}

/* TIMER WIDGET */
#timer-widget{position:fixed;bottom:70px;left:12px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:12px 15px;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,.4);min-width:155px;display:none}
#timer-widget.visible{display:block}

<script>
// ═══════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════
// ENCRYPTED CREDENTIALS — AES-GCM 256-bit via Web Crypto API
//
// How it works:
//   • WEBAPP_URL and ALLOWED_EMAIL are stored as AES-GCM ciphertext.
//   • The decryption key is derived from the user's token at login time
//     using PBKDF2 (100,000 iterations, SHA-256).
//   • Nothing sensitive is ever in plain text in the source.
//   • Wrong token → decryption throws OperationError → login fails cleanly.
//   • Even if someone reads this source, ciphertext is useless without the token.
//
// To re-generate these blobs (e.g. if you change the URL or token):
//   Run the encrypt-credentials.html tool and paste the new values here.
// ═══════════════════════════════════════════════════════════════════════
const ENC_URL   = '4rz0lmtIU7TQqK9hGGXOC6Wd3odRjAVTdOTdHtLMXchYCLPwoHHP84grixH25qQo0KV3MmdZE6WnipnsxjFbEvmpAQtFSappDQR8EC1NeqEAV6eNtHPD+CbQziQ4GFuB2srANggeL0Fyx8eGLOYfWVRaBMUM3Y0bVUBHOu/tu2uMUdLmyig83Dzvw08=';
const ENC_EMAIL = 'Qpe56K+LnJpLjFO2CbYuppMXkF95tIAesbsfWLZf3NBeIaIIATuNCUsxCVfhNarPwt6I';
const SESSION_KEY = 'lt_habit_v1';

// These are populated at runtime after the user's token decrypts them
let WEBAPP_URL    = null;
let ALLOWED_EMAIL = null;
let SECRET_TOKEN  = null; // kept only in sessionStorage after first decrypt

// ── CRYPTO ENGINE ────────────────────────────────────────────────────────────

async function deriveKey(passphrase, salt) {
  const enc = new TextEncoder();
  const raw = await crypto.subtle.importKey(
    'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' },
    raw,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function aesDecrypt(b64, passphrase, salt) {
  const key  = await deriveKey(passphrase, salt);
  const data = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const iv   = data.slice(0, 12);
  const ct   = data.slice(12);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(plain);
}

async function aesEncrypt(plaintext, passphrase, salt) {
  const enc  = new TextEncoder();
  const key  = await deriveKey(passphrase, salt);
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const ct   = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plaintext));
  const combined = new Uint8Array(12 + ct.byteLength);
  combined.set(iv);
  combined.set(new Uint8Array(ct), 12);
  return btoa(String.fromCharCode(...combined));
}

// Decrypt all credentials using the user-supplied token.
// Returns true on success, false if token is wrong.
async function decryptCredentials(token) {
  try {
    // Derive the email from ENC_EMAIL first (salt is fixed per-account)
    const email = await aesDecrypt(ENC_EMAIL, token, token + '_email_salt');
    const url   = await aesDecrypt(ENC_URL,   token, email);
    WEBAPP_URL    = url;
    ALLOWED_EMAIL = email;
    SECRET_TOKEN  = token;
    return true;
  } catch (e) {
    // AES-GCM throws OperationError on wrong key — wrong token → login fails
    WEBAPP_URL = ALLOWED_EMAIL = SECRET_TOKEN = null;
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════

// Sources: Quotable API (primary) + ZenQuotes (backup) + local fallback
// ═══════════════════════════════════════════════════════════════════════

// ── LOCAL FALLBACK (used when offline) ──────────────────────────────
const QUOTES_FALLBACK=[
  {text:"The secret of getting ahead is getting started.",author:"Mark Twain",cat:"learning"},
  {text:"An investment in knowledge pays the best interest.",author:"Benjamin Franklin",cat:"learning"},
  {text:"Learning never exhausts the mind.",author:"Leonardo da Vinci",cat:"learning"},
  {text:"The more I learn, the more I realize how much I don't know.",author:"Albert Einstein",cat:"learning"},
  {text:"Education is not the filling of a pail, but the lighting of a fire.",author:"W.B. Yeats",cat:"learning"},
  {text:"We are what we repeatedly do. Excellence is not an act, but a habit.",author:"Aristotle",cat:"consistency"},
  {text:"Success is the sum of small efforts, repeated day in and day out.",author:"Robert Collier",cat:"consistency"},
  {text:"Discipline is the bridge between goals and accomplishment.",author:"Jim Rohn",cat:"consistency"},
  {text:"Motivation gets you started. Habit keeps you going.",author:"Jim Ryun",cat:"consistency"},
  {text:"First, solve the problem. Then, write the code.",author:"John Johnson",cat:"tech"},
  {text:"Any fool can write code a computer understands. Good programmers write code humans understand.",author:"Martin Fowler",cat:"tech"},
  {text:"Every great developer got there by solving problems they were unqualified to solve.",author:"Patrick McKenzie",cat:"tech"},
  {text:"You don't have to be great to start, but you have to start to be great.",author:"Zig Ziglar",cat:"growth"},
  {text:"A year from now you may wish you had started today.",author:"Karen Lamb",cat:"growth"},
  {text:"The pain of discipline is far less than the pain of regret.",author:"Sarah Bombell",cat:"growth"},
  {text:"The future belongs to those who learn more skills and combine them in creative ways.",author:"Robert Greene",cat:"cloud"},
  {text:"Opportunities don't happen, you create them.",author:"Chris Grosser",cat:"cloud"},
  {text:"Commit yourself to lifelong learning. The most valuable asset you'll ever have is your mind.",author:"Brian Tracy",cat:"learning"},
  {text:"Every expert was once a beginner. Every pro was once an amateur.",author:"Robin Sharma",cat:"growth"},
  {text:"Push yourself, because no one else is going to do it for you.",author:"Anonymous",cat:"consistency"},
];

// ── TAG MAP for Quotable API ─────────────────────────────────────────
// Quotable API tags: https://api.quotable.io/tags
const QUOTABLE_TAGS={
  learning:   ['education','knowledge','wisdom','learning','books','science'],
  consistency:['perseverance','motivation','inspirational','success','discipline'],
  tech:       ['technology','science','business','future'],
  growth:     ['motivational','inspirational','courage','change','goals'],
  cloud:      ['business','success','entrepreneurship','future'],
  random:     ['inspirational','motivational','wisdom','success','life'],
};

// ── QUOTE CACHE ──────────────────────────────────────────────────────
// Cache: lt_qcache_<date>_<cat> = {text,author,cat,source}
// Browse pool: lt_qpool_<cat> = [{text,author,cat},...] (last fetched batch)

function getCachedQuote(cat='random'){
  const key=`lt_qcache_${new Date().toDateString()}_${cat}`;
  try{return JSON.parse(localStorage.getItem(key));}catch{return null;}
}
function setCachedQuote(cat,q){
  const key=`lt_qcache_${new Date().toDateString()}_${cat}`;
  localStorage.setItem(key,JSON.stringify(q));
}
function getQuotePool(cat='random'){
  try{return JSON.parse(localStorage.getItem(`lt_qpool_${cat}`))||[];}catch{return[];}
}
function setQuotePool(cat,pool){
  localStorage.setItem(`lt_qpool_${cat}`,JSON.stringify(pool));
}

// ── FETCH FROM QUOTABLE API ─────────────────────────────────────────
async function fetchFromQuotable(cat='random'){
  const tags=QUOTABLE_TAGS[cat]||QUOTABLE_TAGS.random;
  const tag=tags[Math.floor(Math.random()*tags.length)];
  const url=`https://api.quotable.io/quotes/random?tags=${tag}&limit=10&maxLength=180`;
  const r=await fetch(url,{signal:AbortSignal.timeout(5000)});
  if(!r.ok) throw new Error('Quotable failed');
  const data=await r.json();
  return data.map(q=>({
    text:q.content,
    author:q.author,
    cat:cat,
    source:'quotable',
    tags:(q.tags||[]).join(',')
  }));
}

// ── FETCH FROM ZENQUOTES (backup) ────────────────────────────────────
async function fetchFromZenQuotes(){
  // ZenQuotes CORS proxy — works from browser
  const url='https://zenquotes.io/api/quotes';
  const r=await fetch(url,{signal:AbortSignal.timeout(5000)});
  if(!r.ok) throw new Error('ZenQuotes failed');
  const data=await r.json();
  return data.slice(0,10).map(q=>({
    text:q.q, author:q.a, cat:'random', source:'zenquotes'
  }));
}

// ── MAIN: GET QUOTE OF THE DAY ───────────────────────────────────────
// Returns a quote object. Tries API first, falls back to local.
let _quoteOfDay=null; // cached in memory for the session
let _quoteOfDayCat='random';

async function getQuoteOfDay(cat='random',forceNew=false){
  // Check memory cache first
  if(_quoteOfDay&&_quoteOfDayCat===cat&&!forceNew) return _quoteOfDay;
  // Check localStorage cache (persists for the day)
  if(!forceNew){
    const cached=getCachedQuote(cat);
    if(cached){_quoteOfDay=cached;_quoteOfDayCat=cat;return cached;}
  }
  // Try live API
  try{
    const quotes=await fetchFromQuotable(cat);
    if(quotes&&quotes.length){
      setQuotePool(cat,quotes); // cache pool for browse
      const q=quotes[0];
      setCachedQuote(cat,q);
      _quoteOfDay=q;_quoteOfDayCat=cat;
      return q;
    }
  }catch(e){
    // Quotable failed — try ZenQuotes
    try{
      const quotes=await fetchFromZenQuotes();
      if(quotes&&quotes.length){
        const q=quotes[0];
        setCachedQuote(cat,q);
        _quoteOfDay=q;_quoteOfDayCat=cat;
        return q;
      }
    }catch(e2){}
  }
  // Full offline fallback
  const fallback=QUOTES_FALLBACK.filter(q=>cat==='random'||q.cat===cat);
  const q=fallback[Math.floor(Math.random()*fallback.length)]||QUOTES_FALLBACK[0];
  _quoteOfDay=q;_quoteOfDayCat=cat;
  return q;
}

// ── GET A RANDOM QUOTE (for shuffle) ────────────────────────────────
async function getRandomQuoteLive(cat='random'){
  try{
    const quotes=await fetchFromQuotable(cat);
    if(quotes&&quotes.length){
      setQuotePool(cat,quotes);
      return quotes[Math.floor(Math.random()*quotes.length)];
    }
  }catch{}
  // Try pool cache
  const pool=getQuotePool(cat);
  if(pool.length) return pool[Math.floor(Math.random()*pool.length)];
  // Local fallback
  const fallback=QUOTES_FALLBACK.filter(q=>cat==='random'||q.cat===cat);
  return fallback[Math.floor(Math.random()*fallback.length)]||QUOTES_FALLBACK[0];
}

// ── BROWSE QUOTES (for Quotes tab All view) ─────────────────────────
async function fetchQuotesForBrowse(cat='random'){
  // Try pool first (already fetched)
  const pool=getQuotePool(cat);
  if(pool.length>=5) return pool;
  // Fetch fresh
  try{
    const quotes=await fetchFromQuotable(cat);
    if(quotes&&quotes.length){setQuotePool(cat,quotes);return quotes;}
  }catch{}
  return QUOTES_FALLBACK.filter(q=>cat==='random'||q.cat===cat);
}

// ── COMPAT: QUOTES array (used by saved quotes etc) ─────────────────
// Keep a dynamic QUOTES array populated from pool caches
function getLocalQuotes(cat='all'){
  const all=[];
  ['learning','consistency','tech','growth','cloud','random'].forEach(c=>{
    const pool=getQuotePool(c);
    pool.forEach(q=>{if(!all.find(x=>x.text===q.text))all.push(q);});
  });
  // Add fallback ones not already in pool
  QUOTES_FALLBACK.forEach(q=>{if(!all.find(x=>x.text===q.text))all.push(q);});
  return cat==='all'?all:all.filter(q=>q.cat===cat||q.cat==='random');
}
// Legacy compat shim so old code referencing QUOTES still works
const QUOTES=new Proxy([],{
  get(target,prop){
    const all=getLocalQuotes('all');
    if(prop==='length') return all.length;
    if(typeof prop==='string'&&!isNaN(prop)) return all[+prop];
    if(prop==='filter') return(...args)=>all.filter(...args);
    if(prop==='find') return(...args)=>all.find(...args);
    if(prop==='indexOf') return(...args)=>all.indexOf(...args);
    if(prop==='forEach') return(...args)=>all.forEach(...args);
    if(prop==='map') return(...args)=>all.map(...args);
    if(prop==='slice') return(...args)=>all.slice(...args);
    if(prop==='push') return(...args)=>{target.push(...args);return target.length;};
    return target[prop];
  }
});

// ═══════════════════════════════════════════════════════════════════════
// DATA VERSIONING & MIGRATION
// Bump DATA_VERSION whenever a localStorage data shape changes.
// migrations[n] runs once, upgrading FROM version n TO n+1.
// ═══════════════════════════════════════════════════════════════════════
const DATA_VERSION=2;
const migrations={
  1:()=>{ // v1 -> v2: nothing structural yet, just stamp the version
  },
};
function runMigrations(){
  let v=parseInt(localStorage.getItem('lt_data_version')||'1');
  while(v<DATA_VERSION){
    try{ migrations[v]&&migrations[v](); }catch(e){ console.warn('Migration',v,'failed',e); }
    v++;
  }
  localStorage.setItem('lt_data_version',String(DATA_VERSION));
}
runMigrations();

// ═══════════════════════════════════════════════════════════════════════
// SYNC ENGINE — request queue, retry, offline queue, conflict resolution
// ═══════════════════════════════════════════════════════════════════════
// Why: rapid taps (mark 3 sessions in a row) used to fire parallel requests
// that could race and overwrite each other. Now every write goes through
// one FIFO queue, is retried on failure, and is persisted to localStorage
// so it survives a refresh or a dropped connection until it succeeds.
let _syncQueue=[];
let _syncBusy=false;
let _isOnline=navigator.onLine;

function loadPendingQueue(){
  try{_syncQueue=JSON.parse(localStorage.getItem('lt_pending_queue')||'[]');}catch{_syncQueue=[];}
}
function persistQueue(){localStorage.setItem('lt_pending_queue',JSON.stringify(_syncQueue));}
loadPendingQueue();

function enqueueWrite(req){
  // Collapse: if a write for the same moduleId is already queued and not yet sent, replace it
  // (only the latest status/note for a key matters — no need to send stale intermediate states)
  const dupIdx=_syncQueue.findIndex(q=>q.moduleId===req.moduleId&&q.action===req.action);
  if(dupIdx>=0) _syncQueue[dupIdx]=req; else _syncQueue.push(req);
  persistQueue();
  processQueue();
}

async function processQueue(){
  if(_syncBusy||!_syncQueue.length) return;
  if(!_isOnline){ setSyncState('error'); return; }
  _syncBusy=true;
  setSyncState('syncing');
  while(_syncQueue.length){
    const req=_syncQueue[0];
    try{
      const r=await fetchWithRetry(WEBAPP_URL,{method:'POST',body:JSON.stringify(req)},2);
      const json=await r.json();
      if(!json.success) throw new Error(json.error||'save failed');
      _syncQueue.shift();
      persistQueue();
    }catch(e){
      setSyncState('error');
      _syncBusy=false;
      return; // stop draining — will resume on next enqueue or reconnect
    }
  }
  setSyncState('synced');
  _syncBusy=false;
}

async function fetchWithRetry(url,opts,retries=2,backoffMs=600){
  for(let attempt=0;attempt<=retries;attempt++){
    try{
      const r=await fetch(url,opts);
      if(r.ok) return r;
      throw new Error('HTTP '+r.status);
    }catch(e){
      if(attempt===retries) throw e;
      await new Promise(res=>setTimeout(res,backoffMs*(attempt+1)));
    }
  }
}

window.addEventListener('online',()=>{_isOnline=true;showToast('🌐 Back online — syncing…');processQueue();});
window.addEventListener('offline',()=>{_isOnline=false;setSyncState('error');showToast('📴 Offline — changes will sync when reconnected');});

// ═══════════════════════════════════════════════════════════════════════
// API — all writes go through the queue; reads apply conflict resolution
// ═══════════════════════════════════════════════════════════════════════
async function apiGet(){
  const r=await fetchWithRetry(`${WEBAPP_URL}?action=get&token=${encodeURIComponent(sessionToken)}`,{},2);
  return r.json();
}
// Fire-and-forget write helpers used by the rest of the app.
// They update local state immediately (optimistic UI) and queue the network write.
async function apiSave(key,status,note=''){
  enqueueWrite({action:'save',token:sessionToken,moduleId:key,status,note,clientUpdatedAt:new Date().toISOString()});
  return {success:true}; // optimistic — queue handles real delivery + retry
}
async function apiDel(key){
  enqueueWrite({action:'delete',token:sessionToken,moduleId:key,clientUpdatedAt:new Date().toISOString()});
  return {success:true};
}
async function apiMeta(key,val){
  enqueueWrite({action:'save',token:sessionToken,moduleId:'meta:'+key,status:val,note:'',clientUpdatedAt:new Date().toISOString()});
  return {success:true};
}

// Conflict resolution: called after any fresh apiGet (login + periodic refresh).
// If the server has a NEWER updatedAt for a key than what we hold locally, the
// server value wins (e.g. you marked a session done on your phone, then opened
// the laptop before it synced — laptop will not clobber the phone's newer write).
function mergeServerState(rows){
  let changed=false;
  rows.forEach(r=>{
    if(!r.moduleId||r.moduleId.startsWith('meta:')) return;
    const local=state[r.moduleId];
    const serverTime=r.updatedAt?new Date(r.updatedAt).getTime():0;
    const localTime=local?.updatedAt?new Date(local.updatedAt).getTime():0;
    // Skip keys we have a newer *pending* local write for
    const hasPendingWrite=_syncQueue.some(q=>q.moduleId===r.moduleId);
    if(hasPendingWrite) return;
    if(!local||serverTime>localTime){
      state[r.moduleId]={status:r.status,note:r.note,updatedAt:r.updatedAt};
      changed=true;
    }
  });
  return changed;
}

// Periodic background refresh so a second device's changes appear here too.
let _bgSyncInterval=null;
function startBackgroundSync(){
  clearInterval(_bgSyncInterval);
  _bgSyncInterval=setInterval(async()=>{
    if(!sessionToken||!_isOnline) return;
    try{
      const res=await apiGet();
      if(res.success){
        const changed=mergeServerState(res.data||[]);
        if(changed&&(currentView==='today'||currentView==='dashboard')){
          if(currentView==='today')renderToday();
          if(currentView==='dashboard')renderDashboard();
        }
      }
    }catch{}
  },90000); // every 90s — frequent enough to feel live, gentle on Apps Script quota
}

function setSyncState(s){
  const d=document.getElementById('sync-dot');
  if(d) d.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  const label=document.getElementById('sync-label');
  if(label) label.textContent=s==='syncing'?'Saving…':s==='error'?(_syncQueue.length?`${_syncQueue.length} pending`:'Sync error'):'Synced';
}

// ═══════════════════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════════════════
async function doLogin(){
  const emailInput = document.getElementById('login-email').value.trim();
  const token      = document.getElementById('login-token').value.trim();
  const err        = document.getElementById('login-err');
  const btn        = document.getElementById('login-btn');
  err.textContent  = '';
  if(!emailInput||!token){err.textContent='Please enter email and token.';return;}

  btn.disabled = true;
  document.getElementById('login-spinner').style.display='block';
  err.textContent = 'Verifying…';

  // ── STEP 1: Decrypt credentials using the supplied token ──────────────
  // If the token is wrong, AES-GCM decryption throws — we never reach the API.
  const ok = await decryptCredentials(token);
  if(!ok){
    err.textContent = 'Invalid token — decryption failed.';
    btn.disabled    = false;
    document.getElementById('login-spinner').style.display='none';
    return;
  }

  // ── STEP 2: Confirm the email input matches the decrypted email ────────
  // This provides a second layer — user must know both email AND token.
  if(emailInput.toLowerCase() !== ALLOWED_EMAIL.toLowerCase()){
    err.textContent = 'Email does not match this account.';
    WEBAPP_URL = ALLOWED_EMAIL = SECRET_TOKEN = null;
    btn.disabled = false;
    document.getElementById('login-spinner').style.display='none';
    return;
  }

  // ── STEP 3: Hit the API with the now-decrypted URL ────────────────────
  err.textContent = 'Connecting…';
  sessionToken = token;
  try{
    const res = await apiGet();
    if(!res.success){
      err.textContent = res.error||'Server rejected the request.';
      sessionToken = null;
    } else {
      loadSheet(res.data||[]);
      saveSession(token);
      showApp();
    }
  }catch(e){
    err.textContent = 'Connection failed. Check your internet.';
    sessionToken = null;
  }
  err.textContent = '';
  btn.disabled    = false;
  document.getElementById('login-spinner').style.display='none';
}

function loadSheet(rows){
  rows.forEach(r=>{
    if(!r.moduleId) return;
    if(r.moduleId.startsWith('meta:')){
      const k=r.moduleId.replace('meta:','');
      if(k==='enabledPlans'){try{enabledPlans=JSON.parse(r.status);}catch{}}
      if(k==='activePlan'){activePlanId=r.status||'gcp';}
    } else {
      state[r.moduleId]={status:r.status,note:r.note,updatedAt:r.updatedAt};
    }
  });
  if(!enabledPlans.includes('gcp')) enabledPlans.unshift('gcp');
  // Load books data
  const booksRow=rows.find(r=>r.moduleId==='meta:books');
  if(booksRow?.status) loadBooks(booksRow.status);
  // Load habits data
  const habitsRow=rows.find(r=>r.moduleId==='meta:habits');
  if(habitsRow?.status) loadHabits(habitsRow.status);
}

function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('user-label').textContent=ALLOWED_EMAIL.split('@')[0];
  prevUnlocked=checkAchievements(true);
  init();
  startBackgroundSync();
  if(_syncQueue.length) processQueue();

    const dueReviews=getDueReviews();
    if(dueReviews.length>0){

    }
  },500);
}

function logout(){

  clearSession();sessionToken=null;state={};location.reload();
}

// ═══════════════════════════════════════════════════════════════════════
// SCHEDULE ENGINE
// ═══════════════════════════════════════════════════════════════════════
function nextWeekday(d){
  const r=new Date(d);r.setDate(r.getDate()+1);
  while(r.getDay()===0||r.getDay()===6)r.setDate(r.getDate()+1);
  return r;
}
function getPlanStart(planId){
  const idx=enabledPlans.indexOf(planId);
  if(idx<=0) return new Date(2026,8,25);
  const prev=enabledPlans[idx-1];
  const prevDates=Object.values(getDates(prev));
  if(!prevDates.length) return new Date(2026,8,25);
  return nextWeekday(prevDates.reduce((a,b)=>a>b?a:b));
}
function getDates(planId){
  const plan=PLAN_REGISTRY[planId];if(!plan) return {};
  const START=getPlanStart(planId);
  const result={};
  const completed=plan.sessions.filter(m=>state[sk(planId,m.id)]?.status==='completed').map(m=>m.id);
  const skipped=plan.sessions.filter(m=>state[sk(planId,m.id)]?.status==='skipped').map(m=>m.id);
  const pending=plan.sessions.filter(m=>!state[sk(planId,m.id)]?.status||state[sk(planId,m.id)]?.status==='pending').map(m=>m.id);
  const cSorted=completed.slice().sort((a,b)=>new Date(state[sk(planId,a)]?.updatedAt||0)-new Date(state[sk(planId,b)]?.updatedAt||0));
  cSorted.forEach(id=>{const at=state[sk(planId,id)]?.updatedAt?new Date(state[sk(planId,id)].updatedAt):null;if(at)result[id]=new Date(at);});
  let last=new Date(START);last.setDate(last.getDate()-1);
  Object.values(result).forEach(d=>{if(d>last)last=new Date(d);});
  let next=cSorted.length>0?nextWeekday(last):new Date(START);
  while(next.getDay()===0||next.getDay()===6)next.setDate(next.getDate()+1);
  const today=new Date();today.setHours(0,0,0,0);
  if(next<today&&pending.length>0){next=new Date(today);while(next.getDay()===0||next.getDay()===6)next.setDate(next.getDate()+1);}
  pending.forEach(id=>{result[id]=new Date(next);next=nextWeekday(next);});
  skipped.forEach(id=>{result[id]=new Date(next);next=nextWeekday(next);});
  return result;
}

// ═══════════════════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════════════════
function computeStats(){
  let totalDone=0;const planDone={};
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid];if(!plan)return;
    const done=plan.sessions.filter(m=>state[sk(pid,m.id)]?.status==='completed').length;
    planDone[pid]=done;totalDone+=done;
  });
  let maxPlanPct=0;
  enabledPlans.forEach(pid=>{const plan=PLAN_REGISTRY[pid];if(!plan)return;const pct=Math.round((planDone[pid]/plan.sessions.length)*100);if(pct>maxPlanPct)maxPlanPct=pct;});
  // Streak
  const allDates=[];
  enabledPlans.forEach(pid=>{const plan=PLAN_REGISTRY[pid];if(!plan)return;plan.sessions.forEach(m=>{const s=state[sk(pid,m.id)];if(s?.status==='completed'&&s.updatedAt)allDates.push(new Date(s.updatedAt));});});
  allDates.sort((a,b)=>b-a);
  let streak=0,check=new Date();check.setHours(0,0,0,0);
  for(const d of allDates){const cd=new Date(d);cd.setHours(0,0,0,0);if(Math.abs(check-cd)<=86400000){streak++;check=cd;check.setDate(check.getDate()-1);}else break;}
  // Max day
  const dayMap={};
  enabledPlans.forEach(pid=>{const plan=PLAN_REGISTRY[pid];if(!plan)return;plan.sessions.forEach(m=>{const s=state[sk(pid,m.id)];if(s?.status==='completed'&&s.updatedAt){const dk=new Date(s.updatedAt).toDateString();dayMap[dk]=(dayMap[dk]||0)+1;}});});
  const maxDayDone=Math.max(0,...Object.values(dayMap));
  // Notes
  let noteCount=0;
  enabledPlans.forEach(pid=>{const plan=PLAN_REGISTRY[pid];if(!plan)return;noteCount+=plan.sessions.filter(m=>state[sk(pid,m.id)]?.note?.trim()).length;});
  // Perfect weeks
  const weekMap={};
  enabledPlans.forEach(pid=>{const plan=PLAN_REGISTRY[pid];if(!plan)return;plan.sessions.forEach(m=>{const s=state[sk(pid,m.id)];if(s?.status==='completed'&&s.updatedAt){const d=new Date(s.updatedAt);const wk=`${d.getFullYear()}-W${Math.ceil((d.getDate()-d.getDay()+10)/7)}`;weekMap[wk]=(weekMap[wk]||0)+1;}});});
  const perfectWeeks=Object.values(weekMap).filter(v=>v>=5).length;
  const pomodoroCount=parseInt(localStorage.getItem('lt_pomo_count')||'0');
  const bestStreak=parseInt(localStorage.getItem('lt_best_streak')||'0');
  return{totalDone,planDone,maxPlanPct,streak,maxDayDone,noteCount,perfectWeeks,pomodoroCount,enabledCount:enabledPlans.length,bestStreak:Math.max(streak,bestStreak)};
}

function computeXP(){
  const s=computeStats();
  const achCount=checkAchievements(true).size;
  return s.totalDone*XP_TABLE.session+s.streak*XP_TABLE.streak+s.noteCount*XP_TABLE.note+s.pomodoroCount*XP_TABLE.pomodoro+achCount*XP_TABLE.achievement;
}

function getLevel(xp){let l=LEVELS[0];for(const lvl of LEVELS){if(xp>=lvl.xp)l=lvl;else break;}return l;}
function getNextLevel(xp){for(const lvl of LEVELS){if(xp<lvl.xp)return lvl;}return null;}

function checkAchievements(silent=false){
  const stats=computeStats();
  const now=new Set();
  ACHIEVEMENTS.forEach(a=>{if(a.check(stats))now.add(a.id);});
  if(!silent){now.forEach(id=>{if(!prevUnlocked.has(id)){const a=ACHIEVEMENTS.find(x=>x.id===id);if(a)showAchPopup(a);}});}
  prevUnlocked=now;return now;
}

function showAchPopup(ach){
  document.getElementById('ach-popup-icon').textContent=ach.icon;
  document.getElementById('ach-popup-name').textContent=ach.name;
  document.getElementById('ach-popup-desc').textContent=ach.desc;
  const p=document.getElementById('ach-popup');p.classList.add('show');
  setTimeout(()=>p.classList.remove('show'),4000);
}

function switchView(v){
  currentView=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const viewEl=document.getElementById('view-'+v);
  if(viewEl) viewEl.classList.add('active');
  const navEl=document.getElementById('nav-'+v);
  if(navEl) navEl.classList.add('active');
  // Render each view on demand
  if(v==='today')    renderToday();
  if(v==='dashboard') renderDashboard();
  if(v==='plans')    renderPlans();
  if(v==='books')    renderBooks();
  if(v==='quotes')   renderQuotes();
  if(v==='habits'){  _habitsView='list'; renderHabits(); }
}

// ═══════════════════════════════════════════════════════════════════════
// TODAY VIEW
// ═══════════════════════════════════════════════════════════════════════
function renderToday(){
  const el=document.getElementById('view-today');
  const today=new Date();
  const todayStr=today.toDateString();
  const stats=computeStats();
  if(stats.streak>parseInt(localStorage.getItem('lt_best_streak')||'0'))
    localStorage.setItem('lt_best_streak',stats.streak);

  // Get today's session across all plans
  const todaySessions=[];
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid];if(!plan)return;
    const dates=getDates(pid);
    plan.sessions.forEach(m=>{
      const d=dates[m.id];
      if(d&&d.toDateString()===todayStr) todaySessions.push({plan,m,pid,skey:sk(pid,m.id),d});
    });
  });

  // Weekly habit grid (Mon-Sun current week)
  const mon=new Date(today);mon.setDate(today.getDate()-((today.getDay()+6)%7));
  const weekGrid=Array.from({length:7},(_,i)=>{
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const isToday=d.toDateString()===todayStr;
    const isWeekend=d.getDay()===0||d.getDay()===6;
    const isFuture=d>today;
    let dotClass='wdd-future',dotContent='';
    if(isWeekend){dotClass='wdd-rest';dotContent='—';}
    else if(isToday){dotClass='wdd-today';dotContent=today.getDate();}
    else if(isFuture){dotClass='wdd-future';dotContent=d.getDate();}
    else{
      // Check if any session was done that day
      let hasDone=false,hasSkip=false;
      enabledPlans.forEach(pid=>{
        const plan=PLAN_REGISTRY[pid];if(!plan)return;
        const dates=getDates(pid);
        plan.sessions.forEach(m=>{
          const sd=dates[m.id];if(!sd||sd.toDateString()!==d.toDateString())return;
          const st=state[sk(pid,m.id)]?.status;
          if(st==='completed')hasDone=true;
          if(st==='skipped')hasSkip=true;
        });
      });
      if(hasDone)dotClass='wdd-done';
      else if(hasSkip)dotClass='wdd-partial';
      else dotClass='wdd-missed';
      dotContent=d.getDate();
    }
    return{d,isToday,isWeekend,dotClass,dotContent};
  });

  // Quote of the day — will be loaded async after render
  const quote=getCachedQuote('random')||QUOTES_FALLBACK[Math.floor(Date.now()/86400000)%QUOTES_FALLBACK.length];
  const qSaved=getSavedQuotes().some(q=>q.text===quote.text);

  // Done today count
  let doneToday=0,totalToday=todaySessions.length;
  todaySessions.forEach(({skey})=>{if(state[skey]?.status==='completed')doneToday++;});

  const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  el.innerHTML=`
    <div class="today-date">${today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div>
    <div class="today-heading">${doneToday===totalToday&&totalToday>0?'All done today! 🎉':todaySessions.length===0?'Rest day 😌':"Today's Habit"}</div>
    <div class="today-sub">${todaySessions.length===0?'No sessions scheduled — enjoy your rest day. See you tomorrow!':doneToday===totalToday&&totalToday>0?`You completed ${doneToday} session${doneToday>1?'s':''} today. Streak: ${stats.streak} days 🔥`:`${doneToday} of ${totalToday} session${totalToday>1?'s':''} done · ${stats.streak} day streak 🔥`}</div>

    <!-- DAY SUMMARY -->
    <div class="day-summary">
      <div class="day-stat"><div class="day-stat-v" style="color:var(--yellow)">${stats.streak}</div><div class="day-stat-l">Day Streak</div></div>
      <div class="day-stat"><div class="day-stat-v" style="color:var(--green)">${stats.totalDone}</div><div class="day-stat-l">Total Done</div></div>
      <div class="day-stat"><div class="day-stat-v" style="color:var(--accent)">${enabledPlans.reduce((s,p)=>s+(PLAN_REGISTRY[p]?.sessions.filter(m=>!state[sk(p,m.id)]?.status||state[sk(p,m.id)]?.status==='pending').length||0),0)}</div><div class="day-stat-l">Remaining</div></div>
    </div>

    <!-- WEEK GRID -->
    <div class="week-grid">
      ${weekGrid.map((w,i)=>`
        <div class="week-day-col">
          <div class="week-day-name">${dayNames[i]}</div>
          <div class="week-day-dot ${w.dotClass}">${w.dotContent}</div>
        </div>`).join('')}
    </div>

    <!-- QUOTE STRIP -->
    <div class="quote-strip" id="quote-strip-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div class="quote-strip-cat" id="qs-cat">${quote.cat||'inspiration'} · Quote of the day</div>
        <div id="qs-source-badge" style="font-size:9px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:2px 7px">${quote.source==='quotable'?'🌐 Live':'📦 Local'}</div>
      </div>
      <div class="quote-strip-text" id="qs-text">"${quote.text}"</div>
      <div class="quote-strip-author" id="qs-author">— ${quote.author}</div>
      <div class="quote-strip-actions">
        <button class="quote-action-btn ${qSaved?'saved':''}" onclick="todayQuoteSave()" id="today-save-btn">${qSaved?'❤️ Saved':'🤍 Save'}</button>
        <button class="quote-action-btn" onclick="shuffleTodayQuoteLive()" id="qs-shuffle-btn">🔀 New</button>
        <button class="quote-action-btn" onclick="switchView('quotes')">See all →</button>
      </div>
    </div>

    <!-- TODAY'S HABITS -->
    ${todaySessions.length===0?`
      <div style="text-align:center;padding:30px 20px;background:var(--surface);border:1px solid var(--border);border-radius:14px">
        <div style="font-size:40px;margin-bottom:10px">😌</div>
        <div style="font-size:15px;font-weight:700;margin-bottom:6px">Rest day</div>

function toggleHabitExpand(skey){}// cards always expanded

let _autoSaveTimers={};
function autosaveNote(skey,val){
  clearTimeout(_autoSaveTimers[skey]);
  _autoSaveTimers[skey]=setTimeout(()=>saveHabitNote(skey,val),2000);
}
async function saveHabitNote(skey,note){
  const s=state[skey];
  if(!s||s.status==='pending') return;
  setSyncState('syncing');
  try{
    const r=await apiSave(skey,s.status,note);
    if(r.success){state[skey]={...s,note};setSyncState('synced');}
  }catch{setSyncState('error');}
}

async function doHabit(skey,status){
  const note=document.querySelector(`#hcard-${skey.replace(':','-')} .habit-note`)?.value||'';
  // Optimistic UI — update local state immediately, queue sync in background
  if(status==='pending') delete state[skey];
  else state[skey]={status,note,updatedAt:new Date().toISOString()};
  checkAchievements(false);
  updateStreakPill(computeStats().streak);
  haptic(status==='completed'?'success':'light');
  renderToday();
  showToast(status==='completed'?'✅ Done! +100 XP':status==='skipped'?'↷ Skipped — rescheduled':'↩ Reset');
  // Background sync
  if(status==='pending') await apiDel(skey);
  else await apiSave(skey,status,note);
  // Post-completion extras
  if(status==='completed'){
    setTimeout(()=>showRatingPrompt(skey),600);
    checkAndAwardFreeze();
  }
}

function openSession(skey){
  selectedSessionKey=skey;
  recordSessionOpen(skey);
  switchView('plans');
  setTimeout(()=>renderSessionDetail(),100);
}

let _todayQuoteLive=null; // current quote shown in strip

async function loadTodayQuoteLive(){
  // Always fetch fresh for today (cached per day)
  const cat=quoteCatFilter&&quoteCatFilter!=='all'?quoteCatFilter:'random';
  const q=await getQuoteOfDay(cat,false);
  _todayQuoteLive=q;
  updateQuoteStrip(q);
}

function updateQuoteStrip(q){
  if(!q)return;
  const text=document.getElementById('qs-text');
  const author=document.getElementById('qs-author');
  const cat=document.getElementById('qs-cat');
  const badge=document.getElementById('qs-source-badge');
  const saveBtn=document.getElementById('today-save-btn');
  if(text) text.textContent=`"${q.text}"`;
  if(author) author.textContent=`— ${q.author}`;
  if(cat) cat.textContent=`${q.cat||'inspiration'} · Quote of the day`;
  if(badge){
    badge.textContent=q.source==='quotable'?'🌐 Live':q.source==='zenquotes'?'🌐 Live':'📦 Local';
    badge.style.color=q.source&&q.source!=='local'?'var(--green)':'var(--text3)';
  }
  if(saveBtn){
    const saved=getSavedQuotes().some(x=>x.text===q.text);
    saveBtn.className='quote-action-btn'+(saved?' saved':'');
    saveBtn.textContent=saved?'❤️ Saved':'🤍 Save';
  }
}

async function shuffleTodayQuoteLive(){
  const btn=document.getElementById('qs-shuffle-btn');
  if(btn){btn.textContent='⏳';btn.disabled=true;}
  const cat=quoteCatFilter&&quoteCatFilter!=='all'?quoteCatFilter:'random';
  const q=await getRandomQuoteLive(cat);
  _todayQuoteLive=q;
  updateQuoteStrip(q);
  if(btn){btn.textContent='🔀 New';btn.disabled=false;}
  showToast('✨ Fresh quote loaded!');
}

function todayQuoteSave(){
  const q=_todayQuoteLive||getCachedQuote('random');
  if(!q)return;
  const saved=getSavedQuotes().some(x=>x.text===q.text);
  if(saved){unsaveQuote(q.text);showToast('💔 Removed from saved');}
  else{saveQuoteItem(q);showToast('❤️ Quote saved!');}
  updateQuoteStrip(q);
}

// Legacy shim
function shuffleTodayQuote(){shuffleTodayQuoteLive();}
function toggleTodayQuote(){todayQuoteSave();}

function renderDashboard(){

  // Build heatmap (52 weeks × 7 days)
  const today=new Date();today.setHours(0,0,0,0);
  const hStart=new Date(today);hStart.setDate(today.getDate()-364);
  while(hStart.getDay()!==1)hStart.setDate(hStart.getDate()-1);
  const dateStatus={};
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid];if(!plan)return;

    <!-- MINI STATS -->

      <div class="mini-stat"><div class="mini-stat-v" style="color:var(--purple)">${unlocked.size}/${ACHIEVEMENTS.length}</div><div class="mini-stat-l">Achievements</div></div>
      <div class="mini-stat"><div class="mini-stat-v" style="color:var(--yellow)">${stats.pomodoroCount}</div><div class="mini-stat-l">Pomodoros</div></div>

    <!-- PLANS PROGRESS -->
    <div class="dash-section">
      <div class="dash-section-title">📚 Plans Progress</div>
      ${enabledPlans.map(pid=>{
        const plan=PLAN_REGISTRY[pid];if(!plan)return'';

            <div style="height:100%;width:${pct}%;background:${plan.color};border-radius:99px;transition:width .5s"></div>

        <div class="heatmap-grid">${hmCells.join('')}</div>

          <div class="hm-leg-item"><div class="hm-leg-box" style="background:var(--green)"></div>Done</div>

        </div>

      <div class="ach-grid">
        ${ACHIEVEMENTS.map(a=>{
          const isU=unlocked.has(a.id);
          const s=computeStats();
          let prog=0,max=1;
          if(a.id==='day3'){prog=Math.min(s.streak,3);max=3;}
          else if(a.id==='week1'){prog=Math.min(s.totalDone,5);max=5;}
          else if(a.id==='day7'){prog=Math.min(s.streak,7);max=7;}
          else if(a.id==='day14'){prog=Math.min(s.streak,14);max=14;}
          else if(a.id==='day30'){prog=Math.min(s.streak,30);max=30;}
          else if(a.id==='halfway'){prog=Math.min(s.maxPlanPct,50);max=50;}
          else if(a.id==='notes5'){prog=Math.min(s.noteCount,5);max=5;}
          else if(a.id==='pomo10'){prog=Math.min(s.pomodoroCount,10);max=10;}
          else if(a.id==='century'){prog=Math.min(s.totalDone,100);max=100;}
          else if(a.id==='gcp_done'){prog=Math.min(s.planDone['gcp']||0,22);max=22;}
          else{prog=isU?1:0;max=1;}
          const pct=Math.round((prog/max)*100);
          return`<div class="ach-card ${isU?'unlocked':'locked'}">
            <div class="ach-icon">${a.icon}</div>
            <div class="ach-name">${a.name}</div>
            <div class="ach-desc">${a.desc}</div>

          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

              <div class="guide-hd" onclick="toggleGuide(${gi})">
                <div class="guide-topic">🔗 ${g.topic}</div>
                <div class="guide-arrow" id="ga-${gi}">▼</div>
              </div>
              <div class="guide-steps" id="gs-${gi}">
                ${g.steps.map((s,si)=>`<div class="guide-step"><div class="step-n">Step ${si+1}</div><div class="step-t">${linkify(s)}</div></div>`).join('')}
              </div>
            </div>`).join('')}`:''}
        <div class="note-lbl">Your Notes</div>
        <textarea class="note-ta" id="note-ta" placeholder="Add notes, questions, or what you learned…">${note}</textarea>
      </div>
      <div class="sdc-actions">
        ${!done&&!skipped?`
          <button class="btn btn-green" onclick="markSession('${selectedSessionKey}','completed')">✓ Done</button>
          ${nextPending.length>0?`<button class="btn btn-grad" onclick="markMulti(['${selectedSessionKey}',${nextPending.map(x=>`'${sk(planId,x.id)}'`).join(',')}])">⚡ Done + ${nextPending.length} more</button>`:''}
          <button class="btn btn-yellow" onclick="confirmSkip('${selectedSessionKey}')">↷ Skip</button>
        `:`
          <button class="btn btn-ghost" onclick="markSession('${selectedSessionKey}','pending')">↩ Undo</button>
          <span style="font-size:11px;color:var(--text3)">${done?'✓ Complete!':'↷ Rescheduled'}</span>
        `}
        <span class="sync-lbl" id="sync-msg"></span>
      </div>
    </div>
  `;
  // auto-save notes
  const ta=document.getElementById('note-ta');
  if(ta){
    let t;ta.addEventListener('input',()=>{
      clearTimeout(t);t=setTimeout(async()=>{
        const s=state[selectedSessionKey];if(!s||s.status==='pending')return;
        setSyncState('syncing');
        try{const r=await apiSave(selectedSessionKey,s.status,ta.value);if(r.success){state[selectedSessionKey]={...s,note:ta.value};setSyncState('synced');}}
        catch{setSyncState('error');}
      },2000);
    });
  }
  // Inject bookmark buttons after DOM settles
  setTimeout(()=>injectBookmarkButtons(),80);
}

async function markSession(skey,status,note){
  note=note||document.getElementById('note-ta')?.value||'';
  // Track actual session duration
  const duration=getSessionDuration(skey);
  // Optimistic update
  if(status==='pending') delete state[skey];
  else state[skey]={status,note,updatedAt:new Date().toISOString(),durationMins:duration||undefined};
  haptic(status==='completed'?'success':'light');
  checkAchievements(false);updateStreakPill(computeStats().streak);
  renderSessionDetail();
  // Background sync
  if(status==='pending') await apiDel(skey);
  else await apiSave(skey,status,note);
  // Post-completion
  if(status==='completed'){
    const[pid,mid]=skey.split(':');
    const m=PLAN_REGISTRY[pid]?.sessions.find(x=>x.id===+mid);
    if(m) scheduleReview(skey,m.title);
    if(duration>0&&duration<20) showToast(`✅ Done! (${duration}m — try for 45+ min next time)`);
    else showToast('✅ Saved! +100 XP');
  } else if(status==='skipped'){
    showToast('↷ Skipped — moved to end of plan');
  } else {
    showToast('↩ Reset to pending');
  }
}

async function markMulti(keys){
  const note=document.getElementById('note-ta')?.value||'';
  setSyncState('syncing');
  for(const skey of keys){
    const n=skey===keys[0]?note:'';
    try{const r=await apiSave(skey,'completed',n);if(r.success)state[skey]={status:'completed',note:n,updatedAt:new Date().toISOString()};}catch{}
  }
  setSyncState('synced');checkAchievements(false);updateStreakPill(computeStats().streak);
  const[pid]=keys[0].split(':');
  const nextP=PLAN_REGISTRY[pid]?.sessions.find(m=>!state[sk(pid,m.id)]?.status||state[sk(pid,m.id)]?.status==='pending');
  if(nextP){selectedSessionKey=sk(pid,nextP.id);renderSessionDetail();}
  showToast(`⚡ ${keys.length} sessions done! Schedule pulled forward.`);
}

function confirmSkip(skey){
  const[pid,mid]=skey.split(':');const m=PLAN_REGISTRY[pid]?.sessions.find(x=>x.id===+mid);
  showModal(`
    <div class="modal-title">↷ Skip this session?</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:14px">"<strong>${m?.title}</strong>" will move to the end of your plan.</div>
    <div class="lbl">Reason (optional)</div>
    <input class="modal-inp" id="skip-reason" placeholder="e.g. busy with work…"/>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-yellow" onclick="doSkip('${skey}')">↷ Confirm</button>
    </div>
  `);
}

async function doSkip(skey){
  const reason=document.getElementById('skip-reason')?.value||'';
  closeModal();await markSession(skey,'skipped',reason);
}

function toggleGuide(i){
  const s=document.getElementById('gs-'+i),a=document.getElementById('ga-'+i);
  if(!s)return;s.classList.toggle('open');a&&a.classList.toggle('open');
  if(s.classList.contains('open')) setTimeout(()=>injectBookmarkButtons(),60);
}

function linkify(t){return t.replace(/(https?:\/\/[^\s,]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}

}
async function addPlan(){

// ═══════════════════════════════════════════════════════════════════════
// TIMER & POMODORO
// ═══════════════════════════════════════════════════════════════════════
let _timerSecs=0,_timerRunning=false,_timerInterval=null,_timerMode='session',_timerTotal=0;
let _pomPhase='work',_pomCount=0;
const PW=25*60,PS=5*60,PL=15*60;

function startTimer(mins){
  clearInterval(_timerInterval);_timerMode='session';_timerTotal=mins*60;_timerSecs=mins*60;_timerRunning=true;
  document.getElementById('tw-label').textContent='⏱️ SESSION';
  document.getElementById('timer-widget').classList.add('visible');
  _timerInterval=setInterval(tickTimer,1000);updateTimerUI();
}
function startPomodoro(){
  clearInterval(_timerInterval);_timerMode='pomodoro';_pomPhase='work';_pomCount=0;_timerTotal=PW;_timerSecs=PW;_timerRunning=true;
  document.getElementById('tw-label').textContent='🍅 POMODORO';
  document.getElementById('timer-widget').classList.add('visible');
  _timerInterval=setInterval(tickPomodoro,1000);updateTimerUI();
}
function tickTimer(){
  if(!_timerRunning)return;_timerSecs--;
  if(_timerSecs<=0){_timerSecs=0;_timerRunning=false;clearInterval(_timerInterval);showToast('⏰ Time is up!');}
  updateTimerUI();
}
function tickPomodoro(){
  if(!_timerRunning)return;_timerSecs--;
  if(_timerSecs<=0){
    if(_pomPhase==='work'){
      _pomCount++;const c=parseInt(localStorage.getItem('lt_pomo_count')||'0')+1;localStorage.setItem('lt_pomo_count',c);
      if(_pomCount%4===0){_pomPhase='long';_timerSecs=PL;_timerTotal=PL;showToast('🎉 4 done! 15 min break.');}
      else{_pomPhase='short';_timerSecs=PS;_timerTotal=PS;showToast('✅ Pomodoro done! 5 min break.');}
    }else{_pomPhase='work';_timerSecs=PW;_timerTotal=PW;showToast('🍅 Back to work!');}
    document.getElementById('tw-label').textContent=_pomPhase==='work'?'🍅 FOCUS':_pomPhase==='long'?'😴 LONG BREAK':'☕ BREAK';
  }
  updateTimerUI();
}
function updateTimerUI(){
  const m=Math.floor(_timerSecs/60),s=_timerSecs%60;
  const el=document.getElementById('tw-time');if(!el)return;
  el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.style.color=_timerSecs<=600?'var(--red)':_timerSecs<=1800?'var(--yellow)':'var(--green)';
  const pct=_timerTotal?(_timerSecs/_timerTotal)*100:0;
  document.getElementById('tw-fill').style.width=pct+'%';
  document.getElementById('tw-phase').textContent=_timerMode==='pomodoro'?`${_pomPhase==='work'?'Focus':'Break'} · #${_pomCount+1}`:'';
}
function toggleTimer(){
  _timerRunning=!_timerRunning;
  if(_timerRunning) _timerInterval=setInterval(_timerMode==='pomodoro'?tickPomodoro:tickTimer,1000);
  else clearInterval(_timerInterval);
  document.getElementById('tw-toggle').textContent=_timerRunning?'Pause':'Resume';
}
function resetTimer(){
  clearInterval(_timerInterval);_timerRunning=false;_timerSecs=_timerTotal;updateTimerUI();
  document.getElementById('tw-toggle').textContent='Start';
}
function closeTimer(){
  // If a reading session was active, log it before tearing the widget down
  if(_activeReadingBookId&&_readingTimerRunning){
    _readingTimerRunning=false;
    clearInterval(_readingTimerInterval);
    const mins=Math.round(_readingTimerSecs/60);
    if(mins>=5) saveReadingLog(mins);
    _readingTimerSecs=0;_activeReadingBookId=null;
  }
  clearInterval(_timerInterval);_timerRunning=false;
  document.getElementById('timer-widget').classList.remove('visible');
}

// WEEKLY SUMMARY
// ═══════════════════════════════════════════════════════════════════════
function showWeeklySummary(){
  const today=new Date();today.setHours(0,0,0,0);
  const wStart=new Date(today);wStart.setDate(today.getDate()-((today.getDay()+6)%7));
  const wEnd=new Date(wStart);wEnd.setDate(wStart.getDate()+6);
  const done=[];
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid];if(!plan)return;
    plan.sessions.forEach(m=>{const s=state[sk(pid,m.id)];if(s?.status==='completed'&&s.updatedAt){const d=new Date(s.updatedAt);d.setHours(0,0,0,0);if(d>=wStart&&d<=wEnd)done.push({plan,m});}});
  });
  const stats=computeStats();
  const text=`📊 WEEKLY LEARNING SUMMARY\nWeek of ${wStart.toLocaleDateString()} – ${wEnd.toLocaleDateString()}\n\n✅ Sessions: ${done.length}\n🔥 Streak: ${stats.streak} days\n⭐ XP: ${computeXP().toLocaleString()}\n\n📚 COMPLETED:\n${done.length?done.map(({plan,m})=>`• ${plan.icon} Day ${m.id}: ${m.title}`).join('\n'):'None this week — let\'s make next week count!'}`;
  showModal(`
    <div class="modal-title">📊 Weekly Summary</div>
    <pre style="font-size:12px;color:var(--text2);line-height:1.7;white-space:pre-wrap;background:var(--surface2);padding:14px;border-radius:8px;border:1px solid var(--border);margin-bottom:14px">${text}</pre>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-accent" onclick="navigator.clipboard.writeText(${JSON.stringify(text)}).then(()=>showToast('📋 Copied!'))">📋 Copy</button>
    </div>
  `);
}

// Stored in localStorage + synced to Google Sheets as meta:books

const BOOK_GENRES=['Tech','Self-Help','Business','Biography','Fiction','Science','History','Other'];
const BOOK_EMOJIS=['📗','📘','📙','📕','📔','📒','📓','📃'];
let _books=[];
let _readingTimerSecs=0,_readingTimerRunning=false,_readingTimerInterval=null;
let _activeReadingBookId=null;
let _booksView='library'; // 'library'|'detail'|'log'
let _detailBookId=null;

function getBooks(){return _books;}
function saveBooks(){
  localStorage.setItem('lt_books',JSON.stringify(_books));
  apiMeta('books',JSON.stringify(_books)).catch(()=>{});
}
function loadBooks(data){
  try{_books=JSON.parse(data)||[];}catch{_books=[];}

function genBookId(){return 'bk_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}

// ── TODAY reading habit check-in ──────────────────────────────────────
function getReadingHabitToday(){
  const today=new Date().toDateString();
  const reading=_books.find(b=>b.status==='reading');
  if(!reading) return null;
  const log=reading.readingLog||[];
  const todayLog=log.filter(l=>new Date(l.date).toDateString()===today);
  const totalMins=todayLog.reduce((s,l)=>s+(l.minutes||0),0);
  return{book:reading,totalMins,done:totalMins>=60,todayLog};
}

function startReadingTimer(bookId){
  _activeReadingBookId=bookId;
  _readingTimerSecs=0;
  _readingTimerRunning=true;
  clearInterval(_readingTimerInterval);
  _readingTimerInterval=setInterval(()=>{
    _readingTimerSecs++;
    updateReadingTimerUI();
  },1000);
  document.getElementById('timer-widget').classList.add('visible');
  document.getElementById('tw-label').textContent='📖 READING';
  document.getElementById('tw-phase').textContent='Reading session active';
  updateReadingTimerUI();
  showToast('📖 Reading timer started! Read for 60 minutes.');
}

function updateReadingTimerUI(){
  const m=Math.floor(_readingTimerSecs/60),s=_readingTimerSecs%60;
  document.getElementById('tw-time').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const target=60*60;
  const pct=Math.min((_readingTimerSecs/target)*100,100);
  document.getElementById('tw-fill').style.width=pct+'%';
  const el=document.getElementById('tw-time');
  if(el) el.style.color=_readingTimerSecs>=3600?'var(--green)':_readingTimerSecs>=1800?'var(--yellow)':'var(--purple)';
  if(_readingTimerSecs===3600) showToast('🎉 1 hour reading done! Amazing habit!');
}

function stopReadingTimer(){
  clearInterval(_readingTimerInterval);
  _readingTimerRunning=false;
  const mins=Math.round(_readingTimerSecs/60);
  closeTimer();
  if(mins>=5&&_activeReadingBookId){
    // Ask for pages read and note
    showModal(`
      <div class="modal-title">📖 Log Reading Session</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:14px">You read for <strong>${mins} minutes</strong>. Great work!</div>
      <div class="lbl">Pages read (optional)</div>
      <input class="modal-inp" id="log-pages" type="number" placeholder="e.g. 25" min="0"/>
      <div class="lbl">Note / what you learned</div>
      <input class="modal-inp" id="log-note" placeholder="Key insight or chapter summary…"/>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Skip</button>
        <button class="btn btn-accent" onclick="saveReadingLog(${mins})">Save Session</button>
      </div>
    `);
  } else if(mins>0){
    showToast(`📖 ${mins} min reading session ended.`);
  }
  _readingTimerSecs=0;_activeReadingBookId=null;
}

function saveReadingLog(mins){
  const pages=parseInt(document.getElementById('log-pages')?.value)||0;
  const note=document.getElementById('log-note')?.value||'';
  closeModal();
  const bookId=_activeReadingBookId||(_books.find(b=>b.status==='reading')?.id);
  if(!bookId) return;
  const book=_books.find(b=>b.id===bookId);
  if(!book) return;
  if(!book.readingLog) book.readingLog=[];
  book.readingLog.push({date:new Date().toISOString(),minutes:mins,pages,note});
  if(pages>0) book.currentPage=(book.currentPage||0)+pages;
  if(book.totalPages&&book.currentPage>=book.totalPages){
    book.status='finished';book.finishedAt=new Date().toISOString();
    showToast('🎉 Book finished! Congratulations!');
    showAchPopup({icon:'📚',name:'Book Finished!',desc:`You finished "${book.title}"`});
  }
  saveBooks();
  if(currentView==='today') renderToday();
  if(currentView==='books') renderBooks();
  showToast(`✅ ${mins} min reading logged! ${pages>0?`+${pages} pages`:''}`.trim());
}

function logReadingManual(){
  const today=new Date().toDateString();
  const reading=_books.find(b=>b.status==='reading');
  showModal(`
    <div class="modal-title">📖 Log Reading Manually</div>
    ${reading?`<div style="font-size:13px;color:var(--text2);margin-bottom:14px">Currently reading: <strong>${reading.title}</strong></div>`:''}
    <div class="lbl">Minutes read</div>
    <input class="modal-inp" id="log-mins" type="number" placeholder="e.g. 60" min="1" value="60"/>
    <div class="lbl">Pages read (optional)</div>
    <input class="modal-inp" id="log-pages" type="number" placeholder="e.g. 25" min="0"/>
    <div class="lbl">Note / key insight</div>
    <input class="modal-inp" id="log-note" placeholder="What did you learn or enjoy?"/>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="saveManualLog()">Save</button>
    </div>
  `);
}

function saveManualLog(){
  const mins=parseInt(document.getElementById('log-mins')?.value)||0;
  if(!mins){showToast('Please enter minutes.');return;}
  const bookId=_books.find(b=>b.status==='reading')?.id;
  if(!bookId){showToast('No book currently reading.');closeModal();return;}
  _activeReadingBookId=bookId;
  const pages=parseInt(document.getElementById('log-pages')?.value)||0;
  const note=document.getElementById('log-note')?.value||'';
  closeModal();
  const book=_books.find(b=>b.id===bookId);
  if(!book)return;
  if(!book.readingLog)book.readingLog=[];
  book.readingLog.push({date:new Date().toISOString(),minutes:mins,pages,note});
  if(pages>0)book.currentPage=(book.currentPage||0)+pages;
  if(book.totalPages&&book.currentPage>=book.totalPages){
    book.status='finished';book.finishedAt=new Date().toISOString();
    showToast('🎉 Book finished!');
  }
  saveBooks();
  if(currentView==='today')renderToday();
  if(currentView==='books')renderBooks();
  showToast(`✅ ${mins} min reading logged!`);
}
