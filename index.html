function renderBookCard(b){
  const pct=b.totalPages?Math.round(((b.currentPage||0)/b.totalPages)*100):0;
  const totalMins=(b.readingLog||[]).reduce((s,l)=>s+(l.minutes||0),0);
  const hours=Math.floor(totalMins/60),mins=totalMins%60;
  const today=new Date().toDateString();
  const todayMins=(b.readingLog||[]).filter(l=>new Date(l.date).toDateString()===today).reduce((s,l)=>s+(l.minutes||0),0);
  return`<div class="book-card ${b.status}" onclick="_detailBookId='${b.id}';_booksView='detail';renderBooks()">
    <div class="book-cover">${b.emoji||'📗'}</div>
    <div class="book-info">
      <div class="book-title">${b.title}</div>
      <div class="book-author">${b.author||''}${b.genre?` · ${b.genre}`:''}</div>
      ${b.status==='reading'?`
        <div class="book-prog-bar"><div class="book-prog-fill ${b.status==='finished'?'done':''}" style="width:${pct}%"></div></div>
        <div class="book-meta">
          <span>${b.totalPages?`p.${b.currentPage||0}/${b.totalPages} (${pct}%)`:'tracking pages'}</span>
          <span>${todayMins?`${todayMins}m today`:`${hours>0?hours+'h ':''}${mins}m total`}</span>
        </div>`:''}
      ${b.status==='finished'&&b.rating?`<div style="font-size:13px;margin-top:4px">${'⭐'.repeat(b.rating)}</div>`:''}
      ${b.status==='want'?`<div style="font-size:11px;color:var(--text3);margin-top:4px">${b.totalPages?`${b.totalPages} pages · `:''}Want to read</div>`:''}
    </div>
    <div class="book-badge book-badge-${b.status}">${b.status==='reading'?'Reading':b.status==='finished'?'Done':'Want'}</div>
  </div>`;
}

function renderBookDetail(bookId){
  const el=document.getElementById('view-books');
  const b=_books.find(x=>x.id===bookId);
  if(!b){_booksView='library';renderBooks();return;}
  const pct=b.totalPages?Math.round(((b.currentPage||0)/b.totalPages)*100):0;
  const totalMins=(b.readingLog||[]).reduce((s,l)=>s+(l.minutes||0),0);
  const hours=Math.floor(totalMins/60),mins=totalMins%60;
  const today=new Date().toDateString();
  const todayMins=(b.readingLog||[]).filter(l=>new Date(l.date).toDateString()===today).reduce((s,l)=>s+(l.minutes||0),0);
  const sortedLog=[...(b.readingLog||[])].reverse();

  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button onclick="_booksView='library';renderBooks()" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text2);font-size:12px;cursor:pointer">← Books</button>
      <div class="book-badge book-badge-${b.status}">${b.status==='reading'?'Currently Reading':b.status==='finished'?'Finished':'Want to Read'}</div>
    </div>

    <div class="book-detail-head">
      <div class="book-detail-cover">${b.emoji||'📗'}</div>
      <div class="book-detail-info">
        <div class="book-detail-title">${b.title}</div>
        <div class="book-detail-author">${b.author||'Unknown Author'}</div>
        ${b.genre?`<div style="font-size:11px;color:var(--accent2);font-weight:600;text-transform:uppercase;letter-spacing:.4px">${b.genre}</div>`:''}
        ${b.status==='finished'&&b.rating?`<div style="font-size:16px;margin-top:4px">${'⭐'.repeat(b.rating)}</div>`:''}
      </div>
    </div>

    <!-- STATS -->
    <div class="book-stat-row">
      <div class="book-stat"><div class="book-stat-v">${hours>0?hours+'h ':'' }${mins}m</div><div class="book-stat-l">Total read</div></div>
      <div class="book-stat"><div class="book-stat-v" style="color:var(--green)">${todayMins}m</div><div class="book-stat-l">Today</div></div>
      <div class="book-stat"><div class="book-stat-v" style="color:var(--yellow)">${(b.readingLog||[]).length}</div><div class="book-stat-l">Sessions</div></div>
      ${b.totalPages?`<div class="book-stat"><div class="book-stat-v" style="color:var(--purple)">${pct}%</div><div class="book-stat-l">Progress</div></div>`:''}
    </div>

    <!-- PROGRESS BAR -->
    ${b.totalPages?`
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:5px">
        <span>Page ${b.currentPage||0} of ${b.totalPages}</span><span>${pct}%</span>
      </div>
      <div class="book-prog-bar" style="height:8px"><div class="book-prog-fill ${b.status==='finished'?'done':''}" style="width:${pct}%;height:100%"></div></div>
    </div>`:''}

    <!-- ACTIONS -->
    ${b.status==='reading'?`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button onclick="_activeReadingBookId='${b.id}';startReadingTimer('${b.id}')" style="background:linear-gradient(135deg,var(--purple),var(--accent2));color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:600;cursor:pointer;flex:1">▶ Start Reading Timer</button>
      <button onclick="_activeReadingBookId='${b.id}';logReadingManual()" style="background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:9px 14px;font-size:12px;cursor:pointer">✍️ Log manually</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button onclick="updatePagePrompt('${b.id}')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:7px 12px;font-size:11px;cursor:pointer">📄 Update page</button>
      <button onclick="markBookFinished('${b.id}')" style="background:rgba(31,204,110,.1);border:1px solid rgba(31,204,110,.25);color:var(--green);border-radius:8px;padding:7px 12px;font-size:11px;cursor:pointer">✅ Mark finished</button>
      <button onclick="editBook('${b.id}')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:7px 12px;font-size:11px;cursor:pointer">✏️ Edit</button>
      <button onclick="deleteBook('${b.id}')" style="background:rgba(240,78,78,.1);border:1px solid rgba(240,78,78,.2);color:var(--red);border-radius:8px;padding:7px 12px;font-size:11px;cursor:pointer">🗑️ Delete</button>
    </div>`:`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${b.status==='want'?`<button onclick="startReading('${b.id}')" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:600;cursor:pointer">📖 Start Reading</button>`:''}
      ${b.status==='finished'?`<button onclick="rateBook('${b.id}')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:9px 14px;font-size:12px;cursor:pointer">${b.rating?'Edit Rating':'⭐ Rate'}</button>`:''}
      <button onclick="editBook('${b.id}')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:9px 14px;font-size:12px;cursor:pointer">✏️ Edit</button>
      <button onclick="deleteBook('${b.id}')" style="background:rgba(240,78,78,.1);border:1px solid rgba(240,78,78,.2);color:var(--red);border-radius:8px;padding:9px 14px;font-size:12px;cursor:pointer">🗑️</button>
    </div>`}

    <!-- REVIEW -->
    ${b.status==='finished'?`
    <div style="margin-bottom:16px">
      <div style="font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.4px;margin-bottom:6px">MY REVIEW</div>
      <textarea style="width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:9px 11px;font-size:12px;resize:vertical;min-height:72px;outline:none;font-family:var(--font)" placeholder="Write your thoughts about this book…" onchange="saveBookReview('${b.id}',this.value)">${b.review||''}</textarea>
    </div>`:''}

    <!-- READING LOG -->
    ${sortedLog.length?`
    <div style="font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.4px;margin-bottom:8px">READING LOG (${sortedLog.length} sessions)</div>
    <div style="max-height:280px;overflow-y:auto">
      ${sortedLog.map(l=>`
        <div class="read-log-item">
          <div class="read-log-date">${new Date(l.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
          <div class="read-log-mins">${l.minutes}m</div>
          <div class="read-log-note">${l.pages?`+${l.pages} pages${l.note?' · ':''}`:''} ${l.note||''}</div>
        </div>`).join('')}
    </div>`:`<div style="font-size:13px;color:var(--text3);text-align:center;padding:20px">No reading sessions logged yet. Start reading!</div>`}
  `;
}

    <div class="lbl">Cover Emoji</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      ${BOOK_EMOJIS.map(e=>`<button onclick="selectEmoji('${e}')" id="em-${e}" style="font-size:20px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer;transition:border-color .15s">${e}</button>`).join('')}

function selectEmoji(e){
  window._selEmoji=e;
  document.querySelectorAll('[id^="em-"]').forEach(el=>el.style.borderColor='var(--border)');
  document.getElementById('em-'+e)&&(document.getElementById('em-'+e).style.borderColor='var(--accent)');
}
function selectBookStatus(s){
  window._selStatus=s;
  ['want','reading','finished'].forEach(x=>{
    const el=document.getElementById('bs-'+x);if(!el)return;
    el.style.background=x===s?'var(--accent)':'var(--surface2)';
    el.style.color=x===s?'#fff':'var(--text2)';
  });
}

function addBook(){
  const title=document.getElementById('ab-title')?.value.trim();
  if(!title){showToast('Please enter a title.');return;}
  const book={
    id:genBookId(),title,
    author:document.getElementById('ab-author')?.value.trim()||'',
    genre:document.getElementById('ab-genre')?.value||'',
    totalPages:parseInt(document.getElementById('ab-pages')?.value)||0,
    emoji:window._selEmoji||'📗',
    status:window._selStatus||'reading',
    currentPage:0,readingLog:[],
    startedAt:window._selStatus==='reading'?new Date().toISOString():null,
    finishedAt:window._selStatus==='finished'?new Date().toISOString():null,
  };
  _books.unshift(book);
  saveBooks();closeModal();
  if(currentView==='books')renderBooks();
  if(currentView==='today')renderToday();
  showToast(`📚 "${title}" added!`);
}

function editBook(id){
  const b=_books.find(x=>x.id===id);if(!b)return;
  showModal(`
    <div class="modal-title">✏️ Edit Book</div>
    <div class="lbl">Title</div>
    <input class="modal-inp" id="eb-title" value="${b.title}"/>
    <div class="lbl">Author</div>
    <input class="modal-inp" id="eb-author" value="${b.author||''}"/>
    <div class="lbl">Total Pages</div>
    <input class="modal-inp" id="eb-pages" type="number" value="${b.totalPages||''}"/>
    <div class="lbl">Current Page</div>
    <input class="modal-inp" id="eb-curpage" type="number" value="${b.currentPage||0}"/>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="saveEditBook('${id}')">Save</button>
    </div>
  `);
}
function saveEditBook(id){
  const b=_books.find(x=>x.id===id);if(!b)return;
  b.title=document.getElementById('eb-title')?.value.trim()||b.title;
  b.author=document.getElementById('eb-author')?.value.trim()||b.author;
  b.totalPages=parseInt(document.getElementById('eb-pages')?.value)||b.totalPages;
  b.currentPage=parseInt(document.getElementById('eb-curpage')?.value)||b.currentPage;
  saveBooks();closeModal();renderBookDetail(id);showToast('✅ Book updated!');
}

function deleteBook(id){
  if(!confirm('Delete this book? All reading logs will be lost.'))return;
  _books=_books.filter(b=>b.id!==id);
  saveBooks();_booksView='library';renderBooks();showToast('🗑️ Book deleted.');
}

function startReading(id){
  const b=_books.find(x=>x.id===id);if(!b)return;
  b.status='reading';b.startedAt=new Date().toISOString();
  saveBooks();renderBookDetail(id);showToast('📖 Started reading!');
}

function markBookFinished(id){
  const b=_books.find(x=>x.id===id);if(!b)return;
  if(b.totalPages&&b.currentPage<b.totalPages){
    if(!confirm(`You're on page ${b.currentPage||0} of ${b.totalPages}. Mark as finished anyway?`))return;
    b.currentPage=b.totalPages;
  }
  b.status='finished';b.finishedAt=new Date().toISOString();
  saveBooks();rateBook(id);showAchPopup({icon:'📚',name:'Book Finished!',desc:`You finished "${b.title}"`});
}

function updatePagePrompt(id){
  const b=_books.find(x=>x.id===id);if(!b)return;
  showModal(`
    <div class="modal-title">📄 Update Page</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:12px">Currently on page <strong>${b.currentPage||0}</strong>${b.totalPages?' of '+b.totalPages:''}.</div>
    <div class="lbl">Current page</div>
    <input class="modal-inp" id="up-page" type="number" value="${b.currentPage||0}" min="0" ${b.totalPages?'max="'+b.totalPages+'"':''}/>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="savePageUpdate('${id}')">Save</button>
    </div>
  `);
}
function savePageUpdate(id){
  const b=_books.find(x=>x.id===id);if(!b)return;
  const p=parseInt(document.getElementById('up-page')?.value)||0;
  b.currentPage=p;
  if(b.totalPages&&p>=b.totalPages){b.status='finished';b.finishedAt=new Date().toISOString();showToast('🎉 Book finished!');}
  saveBooks();closeModal();renderBookDetail(id);
}

function rateBook(id){
  const b=_books.find(x=>x.id===id);if(!b)return;
  showModal(`
    <div class="modal-title">⭐ Rate "${b.title}"</div>
    <div style="display:flex;gap:10px;justify-content:center;margin:16px 0">
      ${[1,2,3,4,5].map(n=>`<button onclick="saveRating('${id}',${n})" style="font-size:28px;background:none;border:none;cursor:pointer;opacity:${b.rating>=n?1:.3};filter:${b.rating>=n?'none':'grayscale(1)'}"}>⭐</button>`).join('')}
    </div>
    <div class="lbl">Short review (optional)</div>
    <textarea class="modal-inp" id="rate-review" style="min-height:72px;resize:vertical" placeholder="What did you think?">${b.review||''}</textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Skip</button>
      <button class="btn btn-accent" onclick="saveRatingWithReview('${id}')">Save</button>
    </div>
  `);
}
function saveRating(id,n){
  const b=_books.find(x=>x.id===id);if(!b)return;
  b.rating=n;saveBooks();
  // re-render stars
  [1,2,3,4,5].forEach(i=>{
    const btn=document.querySelector(`.modal [onclick="saveRating('${id}',${i})"]`);
    if(btn){btn.style.opacity=n>=i?1:.3;btn.style.filter=n>=i?'none':'grayscale(1)';}
  });
}
function saveRatingWithReview(id){
  const b=_books.find(x=>x.id===id);if(!b)return;
  b.review=document.getElementById('rate-review')?.value||'';
  saveBooks();closeModal();renderBookDetail(id);showToast('⭐ Rating saved!');
}
function saveBookReview(id,text){
  const b=_books.find(x=>x.id===id);if(!b)return;
  b.review=text;saveBooks();
}

// ── READING HABIT CARD (injected into Today view — see renderToday) ──
function injectReadingHabit(){
  const el=document.getElementById('view-today');
  if(!el||document.getElementById('reading-habit-inject'))return;
  const habit=getReadingHabitToday();
  const reading=_books.find(b=>b.status==='reading');
  if(!reading){
    // Show "add a book" nudge
    const nudge=document.createElement('div');
    nudge.id='reading-habit-inject';
    nudge.style.cssText='background:linear-gradient(135deg,rgba(168,85,247,.08),rgba(61,127,255,.05));border:1px solid rgba(168,85,247,.2);border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer';
    nudge.onclick=()=>{switchView('books');setTimeout(showAddBook,100);};
    nudge.innerHTML=`<div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:28px">📚</div>
      <div><div style="font-size:14px;font-weight:600">Add a book to read daily</div>
      <div style="font-size:12px;color:var(--text2);margin-top:2px">1 hour of reading every day. Tap to add your first book.</div></div>
    </div>`;
    const toolsRow=el.querySelector('[onclick*="startPomodoro"]')?.parentElement;
    if(toolsRow)toolsRow.before(nudge);else el.appendChild(nudge);
    return;
  }
  const totalMins=habit?.totalMins||0;
  const done=totalMins>=60;
  const pct=Math.min(Math.round((totalMins/60)*100),100);
  const timeLeft=Math.max(60-totalMins,0);
  const card=document.createElement('div');
  card.id='reading-habit-inject';
  card.className='reading-habit-card';
  card.innerHTML=`
    <div class="reading-habit-head">
      <div class="reading-habit-icon">📖</div>
      <div class="reading-habit-info">
        <div class="reading-habit-title">${done?'Reading done! 🎉':'Daily Reading · 1 hour'}</div>
        <div class="reading-habit-sub">${reading.title}${reading.author?' · '+reading.author:''}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:18px;font-weight:800;color:${done?'var(--green)':'var(--purple)'}">${totalMins}m</div>
        <div style="font-size:10px;color:var(--text3)">${done?'of 60m ✓':`${timeLeft}m left`}</div>
      </div>
    </div>
    <div style="height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:10px">
      <div style="height:100%;width:${pct}%;background:${done?'var(--green)':'linear-gradient(90deg,var(--purple),var(--accent2))'};border-radius:99px;transition:width .4s"></div>
    </div>
    <div class="read-action-row">
      ${done?`
        <button onclick="switchView('books');_detailBookId='${reading.id}';_booksView='detail';renderBooks()" style="background:rgba(31,204,110,.12);border:1px solid rgba(31,204,110,.25);color:var(--green);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer">✅ View log</button>
        <button onclick="_activeReadingBookId='${reading.id}';logReadingManual()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer">+ Add more</button>
      `:`
        <button onclick="startReadingTimer('${reading.id}')" style="background:linear-gradient(135deg,var(--purple),var(--accent2));color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer">▶ Start Reading</button>
        <button onclick="_activeReadingBookId='${reading.id}';logReadingManual()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer">✍️ Log manually</button>
        <button onclick="switchView('books')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer">📚 Books</button>
      `}
    </div>
  `;
  // Insert after the quote strip
  const quoteStrip=el.querySelector('.quote-strip');
  if(quoteStrip)quoteStrip.after(card);
  else{const toolsRow=el.querySelector('[onclick*="startPomodoro"]')?.parentElement;if(toolsRow)toolsRow.before(card);else el.appendChild(card);}
}

  }},

  {id:'books3',icon:'📚',name:'Bookworm',desc:'Finish 3 books',check:()=>_books.filter(b=>b.status==='finished').length>=3},
  {id:'read7',icon:'📅',name:'Reading Streak',desc:'Read 7 days in a row',check:()=>{
    let streak=0;const d=new Date();d.setHours(0,0,0,0);
    for(let i=0;i<30;i++){
      const ds=new Date(d);ds.setDate(d.getDate()-i);const dk=ds.toDateString();
      const mins=_books.reduce((s,b)=>(b.readingLog||[]).filter(l=>new Date(l.date).toDateString()===dk).reduce((ss,l)=>ss+(l.minutes||0),0)+s,0);
      if(mins>=30)streak++;else break;
    }
    return streak>=7;
  }},
);

// ═══════════════════════════════════════════════════════════════════════
// IMPROVEMENT 1: STREAK FREEZE
// Earn 1 freeze token per 5 completed sessions. Use to protect streak.
// ═══════════════════════════════════════════════════════════════════════
function getStreakFreezes(){return parseInt(localStorage.getItem('lt_freezes')||'0');}
function setStreakFreezes(n){localStorage.setItem('lt_freezes',Math.max(0,n));}
function getFreezeUsedToday(){return localStorage.getItem('lt_freeze_used')===new Date().toDateString();}

function checkAndAwardFreeze(){
  const stats=computeStats();
  const earned=Math.floor(stats.totalDone/5);
  const prev=parseInt(localStorage.getItem('lt_freeze_earned')||'0');
  if(earned>prev){
    const newFreezes=earned-prev;
    setStreakFreezes(getStreakFreezes()+newFreezes);
    localStorage.setItem('lt_freeze_earned',earned);
    showToast(`🧊 +${newFreezes} Streak Freeze earned! (${getStreakFreezes()} total)`);
  }
}

function useStreakFreeze(){
  const freezes=getStreakFreezes();
  if(freezes<=0){showToast('❌ No streak freezes available. Complete 5 sessions to earn one.');return;}

  localStorage.setItem('lt_freeze_used',new Date().toDateString());
  setStreakFreezes(freezes-1);
  showToast(`❄️ Streak freeze used! Your streak is protected today. (${getStreakFreezes()} left)`);
  renderToday();
}

// IMPROVEMENT 3: MONTHLY REPORT (copy/share)
// ═══════════════════════════════════════════════════════════════════════
function showMonthlyReport(){
  const now=new Date();
  const mStart=new Date(now.getFullYear(),now.getMonth(),1);
  const mEnd=new Date(now.getFullYear(),now.getMonth()+1,0);
  const mName=now.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  const done=[],skipped=[];
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid];if(!plan)return;
    plan.sessions.forEach(m=>{
      const s=state[sk(pid,m.id)];
      if(!s?.updatedAt)return;
      const d=new Date(s.updatedAt);
      if(d<mStart||d>mEnd)return;
      if(s.status==='completed') done.push({plan,m,s});
      if(s.status==='skipped') skipped.push({plan,m,s});
    });
  });

  const stats=computeStats();
  const xp=computeXP();
  const level=getLevel(xp);
  const booksMinsMonth=_books.reduce((total,b)=>{
    return total+(b.readingLog||[]).filter(l=>{const d=new Date(l.date);return d>=mStart&&d<=mEnd;}).reduce((s,l)=>s+(l.minutes||0),0);
  },0);

  // Per-week breakdown
  const weekMap={};
  done.forEach(({s})=>{
    const d=new Date(s.updatedAt);
    const wk=`Week ${Math.ceil(d.getDate()/7)}`;
    weekMap[wk]=(weekMap[wk]||0)+1;
  });

  const ratings=done.map(({m,plan})=>{
    const r=getSessionRating(sk(plan.id,m.id));
    return r?.rating||0;
  }).filter(Boolean);
  const avgRating=ratings.length?Math.round(ratings.reduce((a,b)=>a+b,0)/ratings.length*10)/10:null;

  const report=`📊 MONTHLY LEARNING REPORT — ${mName}
${'═'.repeat(40)}

✅ Sessions Completed: ${done.length}
↷ Sessions Skipped:   ${skipped.length}
🔥 Current Streak:    ${stats.streak} days
⭐ XP Earned:         ${xp.toLocaleString()}
${level.icon} Level:            ${level.title} (${level.level})
📖 Reading:           ${Math.floor(booksMinsMonth/60)}h ${booksMinsMonth%60}m
${avgRating?`⭐ Avg Session Rating: ${avgRating}/5`:''}

WEEKLY BREAKDOWN:
${Object.entries(weekMap).map(([w,c])=>`  ${w}: ${c} session${c!==1?'s':''} ${'█'.repeat(c)}`).join('\n')||'  No sessions completed'}

COMPLETED SESSIONS:
${done.length?done.map(({plan,m})=>`  ${plan.icon} Day ${m.id}: ${m.title}`).join('\n'):'  None this month'}

${skipped.length?`SKIPPED SESSIONS:\n${skipped.map(({plan,m})=>`  ${plan.icon} Day ${m.id}: ${m.title}`).join('\n')}\n`:''}
HABIT STATUS:
  📚 Plans active: ${enabledPlans.length}
  📖 Books reading: ${_books.filter(b=>b.status==='reading').length}
  🏆 Achievements:  ${checkAchievements(true).size}/${ACHIEVEMENTS.length}

${'═'.repeat(40)}
Generated by Daily Learning Habit Tracker`;

  showModal(`
    <div class="modal-title">📊 ${mName} Report</div>
    <pre style="font-size:11px;color:var(--text2);line-height:1.7;white-space:pre-wrap;background:var(--surface2);padding:14px;border-radius:8px;border:1px solid var(--border);margin-bottom:14px;max-height:55vh;overflow-y:auto">${report}</pre>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-accent" onclick="navigator.clipboard.writeText(${JSON.stringify(report)}).then(()=>showToast('📋 Copied!'))">📋 Copy</button>
    </div>
  `);
}

// IMPROVEMENT 4: BOOKMARKS (save specific steps inside guidance)
// ═══════════════════════════════════════════════════════════════════════
function getBookmarks(){try{return JSON.parse(localStorage.getItem('lt_bookmarks')||'[]');}catch{return[];}}
function saveBookmarks(bm){localStorage.setItem('lt_bookmarks',JSON.stringify(bm));}

function toggleBookmark(skey,guideIdx,stepIdx,stepText){
  const bm=getBookmarks();
  const id=`${skey}|${guideIdx}|${stepIdx}`;
  const existing=bm.findIndex(b=>b.id===id);
  if(existing>=0){
    bm.splice(existing,1);
    saveBookmarks(bm);showToast('🔖 Bookmark removed.');
  }else{
    const[pid,mid]=skey.split(':');
    const plan=PLAN_REGISTRY[pid];
    const m=plan?.sessions.find(x=>x.id===+mid);
    bm.push({id,skey,guideIdx,stepIdx,stepText,planName:plan?.name,sessionTitle:m?.title,savedAt:new Date().toISOString()});
    saveBookmarks(bm);showToast('🔖 Step bookmarked!');
  }
  // Refresh guide step UI
  const btn=document.getElementById(`bm-${skey.replace(':','-')}-${guideIdx}-${stepIdx}`);
  if(btn) btn.textContent=getBookmarks().some(b=>b.id===id)?'🔖':'☆';
}

function showBookmarks(){
  const bm=getBookmarks();
  showModal(`
    <div class="modal-title">🔖 Bookmarked Steps <span style="font-size:12px;font-weight:400;color:var(--text2)">${bm.length} saved</span></div>
    <div style="max-height:60vh;overflow-y:auto">
      ${bm.length===0?`<div style="text-align:center;padding:24px;color:var(--text3)">No bookmarks yet.<br>Tap ☆ on any guide step to bookmark it.</div>`
      :bm.map(b=>`
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:8px">
          <div style="font-size:10px;color:var(--accent);font-weight:600;margin-bottom:4px">${b.planName||''} · ${b.sessionTitle||''}</div>
          <div style="font-size:12px;color:var(--text);line-height:1.6">${b.stepText}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <div style="font-size:10px;color:var(--text3)">${new Date(b.savedAt).toLocaleDateString()}</div>
            <div style="display:flex;gap:6px">
              <button onclick="openSession('${b.skey}');closeModal()" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer">Open →</button>
              <button onclick="removeBookmark('${b.id}')" style="background:none;border:1px solid rgba(240,78,78,.3);color:var(--red);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer">Remove</button>
            </div>
          </div>
        </div>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>
  `);
}

function removeBookmark(id){
  const bm=getBookmarks().filter(b=>b.id!==id);
  saveBookmarks(bm);showBookmarks(); // refresh
}

// (bookmark injection merged into single renderSessionDetail above)
function injectBookmarkButtons(){
  const skey=selectedSessionKey;if(!skey)return;
  const bm=getBookmarks();
  document.querySelectorAll('.guide-steps.open .guide-step').forEach((stepEl,idx)=>{
    // Parse guideIdx from parent
    const stepsDiv=stepEl.closest('.guide-steps');
    if(!stepsDiv)return;
    const guideIdx=parseInt(stepsDiv.id.replace('gs-',''));
    const stepText=stepEl.querySelector('.step-t')?.textContent||'';
    const id=`${skey}|${guideIdx}|${idx}`;
    const isBm=bm.some(b=>b.id===id);
    if(stepEl.querySelector('.bm-btn'))return;
    const btn=document.createElement('button');
    btn.className='bm-btn';
    btn.id=`bm-${skey.replace(':','-')}-${guideIdx}-${idx}`;
    btn.textContent=isBm?'🔖':'☆';
    btn.title=isBm?'Remove bookmark':'Bookmark this step';
    btn.style.cssText='background:none;border:none;cursor:pointer;font-size:14px;flex-shrink:0;padding:0 4px;color:var(--text3)';
    btn.onclick=()=>toggleBookmark(skey,guideIdx,idx,stepText);
    stepEl.appendChild(btn);
  });
}

// ── SCHEDULE CHECK ───────────────────────────────────────────────────
function isHabitScheduledToday(h){
  const dow=new Date().getDay(); // 0=Sun,6=Sat
  if(h.frequency==='daily') return true;
  if(h.frequency==='weekdays') return dow>=1&&dow<=5;
  if(h.frequency==='weekends') return dow===0||dow===6;
  if(h.frequency==='custom') return(h.days||[]).includes(dow);
  return true;
}

function getTodayLog(h){
  const today=new Date().toDateString();
  return(h.logs||[]).find(l=>new Date(l.date).toDateString()===today);
}
function getTodayStatus(h){
  const log=getTodayLog(h);
  if(!log) return 'pending';
  if(log.done) return 'done';
  if(log.skipped) return 'skipped';
  return 'partial';
}

// ── HABIT STREAK ────────────────────────────────────────────────────
function getHabitStreak(h){
  let streak=0;
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<365;i++){
    const d=new Date(today);d.setDate(today.getDate()-i);
    if(!isHabitScheduledOnDay(h,d)){continue;} // skip non-scheduled days
    const dk=d.toDateString();
    const log=(h.logs||[]).find(l=>new Date(l.date).toDateString()===dk);
    if(log?.done) streak++;
    else if(i===0) continue; // today not done yet — don't break
    else break;
  }
  return streak;
}

function isHabitScheduledOnDay(h,d){
  const dow=d.getDay();
  if(h.frequency==='daily') return true;
  if(h.frequency==='weekdays') return dow>=1&&dow<=5;
  if(h.frequency==='weekends') return dow===0||dow===6;
  if(h.frequency==='custom') return(h.days||[]).includes(dow);
  return true;
}

function getHabitCompletionRate(h,days=30){
  let done=0,scheduled=0;
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<days;i++){
    const d=new Date(today);d.setDate(today.getDate()-i);
    if(!isHabitScheduledOnDay(h,d)) continue;
    scheduled++;
    const log=(h.logs||[]).find(l=>new Date(l.date).toDateString()===d.toDateString());
    if(log?.done) done++;
  }
  return scheduled?Math.round((done/scheduled)*100):0;
}

function getLast7DaysStatus(h){
  const result=[];
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=6;i>=0;i--){
    const d=new Date(today);d.setDate(today.getDate()-i);
    const isScheduled=isHabitScheduledOnDay(h,d);
    const isToday=i===0;
    const log=(h.logs||[]).find(l=>new Date(l.date).toDateString()===d.toDateString());
    let status='none';
    if(!isScheduled) status='off';
    else if(log?.done) status='done';
    else if(log?.skipped) status='skip';
    else if(isToday) status='today';
    else status='missed';
    result.push({d,status,isToday});
  }
  return result;
}

async function logHabit(id,done,count,note=''){
  const h=_habits.find(x=>x.id===id);if(!h)return;
  if(!h.logs)h.logs=[];
  const today=new Date().toDateString();
  const idx=h.logs.findIndex(l=>new Date(l.date).toDateString()===today);
  const entry={date:new Date().toISOString(),done,count:count||1,note,skipped:!done&&count===0};
  if(idx>=0)h.logs[idx]=entry;else h.logs.push(entry);
  saveHabits();
  checkHabitAchievements();

}

// Announce dynamic content changes to screen readers
function ariaAnnounce(msg){
  let el=document.getElementById('aria-live-region');
  if(!el){
    el=document.createElement('div');
    el.id='aria-live-region';
    el.setAttribute('aria-live','polite');
    el.setAttribute('aria-atomic','true');
    el.style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)';
    document.body.appendChild(el);
  }
  el.textContent='';
  setTimeout(()=>{ el.textContent=msg; },50);
}

// SPACED REPETITION REVIEW SYSTEM
// After completing a session, schedule reviews at day +3, +7, +30
// ═══════════════════════════════════════════════════════════════════════
function getReviewSchedule(){
  try{return JSON.parse(localStorage.getItem('lt_reviews')||'[]');}catch{return[];}
}
function saveReviewSchedule(s){localStorage.setItem('lt_reviews',JSON.stringify(s));}

function scheduleReview(skey,sessionTitle){
  const schedule=getReviewSchedule();
  const now=new Date();
  [3,7,30].forEach(days=>{
    const reviewDate=new Date(now);
    reviewDate.setDate(now.getDate()+days);
    // Skip weekends for reviews — move to Monday
    while(reviewDate.getDay()===0||reviewDate.getDay()===6) reviewDate.setDate(reviewDate.getDate()+1);
    const id=`${skey}|${days}`;
    if(!schedule.find(r=>r.id===id)){
      schedule.push({id,skey,sessionTitle,reviewDate:reviewDate.toISOString(),days,done:false});
    }
  });
  saveReviewSchedule(schedule);
}

function getTodayReviews(){
  const today=new Date().toDateString();
  return getReviewSchedule().filter(r=>!r.done&&new Date(r.reviewDate).toDateString()===today);
}
function getDueReviews(){
  const today=new Date();today.setHours(0,0,0,0);
  return getReviewSchedule().filter(r=>!r.done&&new Date(r.reviewDate)<=today);
}
function markReviewDone(id){
  const s=getReviewSchedule().map(r=>r.id===id?{...r,done:true,completedAt:new Date().toISOString()}:r);
  saveReviewSchedule(s);
}

function showDueReviews(){
  const due=getDueReviews();
  if(!due.length){showToast('✅ No reviews due!');return;}
  showModal(`
    <div class="modal-title">🔁 Spaced Repetition Reviews <span style="font-size:12px;font-weight:400;color:var(--text2)">${due.length} due</span></div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6">These sessions are due for review. Try to recall the key concepts before looking at your notes — this is how knowledge sticks long-term.</div>
    <div style="max-height:55vh;overflow-y:auto">
      ${due.map(r=>`
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div>
              <div style="font-size:13px;font-weight:600;margin-bottom:2px">${r.sessionTitle}</div>
              <div style="font-size:11px;color:var(--text2)">${r.days}-day review · due ${new Date(r.reviewDate).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
            </div>
            <div style="display:flex;gap:6px;flex-shrink:0">
              <button onclick="openSession('${r.skey}');closeModal()" style="background:var(--accent);color:#fff;border:none;border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer;font-weight:600">Review →</button>
              <button onclick="markReviewDone('${r.id}');this.closest('[style*=border-radius]').remove();showToast('✓ Review done!')" style="background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer">Done</button>
            </div>
          </div>
        </div>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>
  `);
}

// ═══════════════════════════════════════════════════════════════════════
// SMART INSIGHTS ENGINE
// Analyses your patterns and shows one actionable insight per day
// ═══════════════════════════════════════════════════════════════════════
function computeInsights(){
  const insights=[];
  const now=new Date();now.getDay();
  const stats=computeStats();

  // 1. Streak at risk warning
  if(stats.streak>=3){
    const today=new Date();today.setHours(0,0,0,0);
    const hasDoneToday=enabledPlans.some(pid=>{
      const plan=PLAN_REGISTRY[pid];if(!plan)return false;
      return plan.sessions.some(m=>state[sk(pid,m.id)]?.status==='completed'&&
        new Date(state[sk(pid,m.id)].updatedAt).toDateString()===today.toDateString());
    });
    if(!hasDoneToday&&now.getHours()>=15){
      insights.push({icon:'⚠️',type:'warn',title:'Streak at risk!',
        body:`It's past 3 PM and no session marked today. Your ${stats.streak}-day streak ends at midnight.`,
        action:'Go to Today',actionFn:"switchView('today')"});
    }
  }

  // 2. Spaced repetition reviews due
  const dueReviews=getDueReviews();
  if(dueReviews.length>0){
    insights.push({icon:'🔁',type:'info',title:`${dueReviews.length} review${dueReviews.length>1?'s':''} due`,
      body:`Spaced repetition reviews are waiting. Reviewing now locks in long-term memory.`,
      action:'Start reviewing',actionFn:'showDueReviews()'});
  }

  // 3. Day-of-week pattern (which day do you complete most?)
  const dayCount={};
  enabledPlans.forEach(pid=>{const plan=PLAN_REGISTRY[pid];if(!plan)return;
    plan.sessions.forEach(m=>{const s=state[sk(pid,m.id)];
      if(s?.status==='completed'&&s.updatedAt){
        const d=new Date(s.updatedAt).getDay();
        dayCount[d]=(dayCount[d]||0)+1;
      }
    });
  });
  const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const sortedDays=Object.entries(dayCount).sort((a,b)=>b[1]-a[1]);
  if(sortedDays.length>=3){
    const best=dayNames[+sortedDays[0][0]];
    const worst=dayNames[+sortedDays[sortedDays.length-1][0]];
    insights.push({icon:'📈',type:'tip',title:`Your strongest day is ${best}`,
      body:`You complete ${sortedDays[0][1]} sessions on ${best}s vs ${sortedDays[sortedDays.length-1][1]} on ${worst}s. Consider easier topics on ${worst}s.`,
      action:null});
  }

  // 4. Session duration insight
  const durations=[];
  enabledPlans.forEach(pid=>{const plan=PLAN_REGISTRY[pid];if(!plan)return;
    plan.sessions.forEach(m=>{const s=state[sk(pid,m.id)];
      if(s?.status==='completed'&&s.durationMins) durations.push(s.durationMins);
    });
  });
  if(durations.length>=3){
    const avg=Math.round(durations.reduce((a,b)=>a+b,0)/durations.length);
    if(avg<45) insights.push({icon:'⏱️',type:'tip',title:`Avg session: ${avg} min`,
      body:`Your sessions average ${avg} minutes. Your target is 2 hours. Try starting the timer before opening the session.`,
      action:'Start 2h timer',actionFn:'startTimer(120)'});
    else insights.push({icon:'⏱️',type:'good',title:`Solid ${avg}-min average!`,
      body:`You're averaging ${avg} minutes per session — that's real deep work.`,action:null});
  }

  // 5. Notes rate
  if(stats.totalDone>5&&stats.noteCount/stats.totalDone<0.3){
    insights.push({icon:'📝',type:'tip',title:'Write more notes',
      body:`Only ${Math.round(stats.noteCount/stats.totalDone*100)}% of your sessions have notes. Notes earn +20 XP and dramatically improve retention.`,
      action:null});
  }

  // 6. Book reading consistency
  if(_books.length>0){
    const reading=_books.find(b=>b.status==='reading');
    if(reading){
      const last7=Array.from({length:7},(_,i)=>{
        const d=new Date();d.setDate(d.getDate()-i);d.setHours(0,0,0,0);
        return (reading.readingLog||[]).filter(l=>new Date(l.date).toDateString()===d.toDateString()).reduce((s,l)=>s+(l.minutes||0),0);
      });
      const daysRead=last7.filter(m=>m>=20).length;
      if(daysRead<=2) insights.push({icon:'📖',type:'tip',title:'Reading streak broken',
        body:`You've only read ${daysRead} of the last 7 days. Even 20 minutes counts toward the habit.`,
        action:'Start reading',actionFn:`startReadingTimer('${reading.id}')`});
    }
  }

  return insights.slice(0,3); // show max 3
}

function renderInsightsBanner(){
  const existing=document.getElementById('insights-banner');
  if(existing) existing.remove();
  const insights=computeInsights();
  if(!insights.length) return;
  const el=document.querySelector('#view-today .day-summary');
  if(!el) return;
  const banner=document.createElement('div');
  banner.id='insights-banner';
  banner.style.cssText='margin-bottom:16px';
  banner.innerHTML=insights.map(ins=>{
    const colors={warn:'rgba(240,78,78,.1)',info:'rgba(61,127,255,.08)',tip:'rgba(168,85,247,.08)',good:'rgba(31,204,110,.08)'};
    const borders={warn:'rgba(240,78,78,.25)',info:'rgba(61,127,255,.2)',tip:'rgba(168,85,247,.2)',good:'rgba(31,204,110,.2)'};
    return`<div style="background:${colors[ins.type]||colors.info};border:1px solid ${borders[ins.type]||borders.info};border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px">
      <div style="font-size:20px;flex-shrink:0">${ins.icon}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;margin-bottom:2px">${ins.title}</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.5">${ins.body}</div>
        ${ins.action?`<button onclick="${ins.actionFn}" style="margin-top:8px;background:none;border:1px solid var(--border2);color:var(--accent);border-radius:6px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer">${ins.action} →</button>`:''}
      </div>
    </div>`;
  }).join('');
  el.after(banner);
}

// ═══════════════════════════════════════════════════════════════════════
// BOOK FINISH-DATE PREDICTION
// ═══════════════════════════════════════════════════════════════════════
function getBookFinishPrediction(book){
  if(!book.totalPages||!book.currentPage) return null;
  const pagesLeft=book.totalPages-book.currentPage;
  if(pagesLeft<=0) return null;
  // Average pages per session from last 10 log entries
  const recentLogs=(book.readingLog||[]).filter(l=>l.pages>0).slice(-10);
  if(!recentLogs.length) return null;
  const avgPages=recentLogs.reduce((s,l)=>s+l.pages,0)/recentLogs.length;
  if(avgPages<1) return null;
  const sessionsLeft=Math.ceil(pagesLeft/avgPages);
  const avgGapDays=1; // assuming daily reading habit
  const finishDate=new Date();
  finishDate.setDate(finishDate.getDate()+sessionsLeft*avgGapDays);
  return{pagesLeft,avgPages:Math.round(avgPages),sessionsLeft,finishDate};
}

// COMMAND PALETTE (Ctrl+K / Cmd+K)
// ═══════════════════════════════════════════════════════════════════════
let _paletteOpen=false;
function openCommandPalette(){
  if(_paletteOpen) return;
  _paletteOpen=true;
  const overlay=document.createElement('div');
  overlay.id='cmd-palette';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding-top:80px';
  overlay.innerHTML=`
    <div style="background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:92%;max-width:520px;box-shadow:0 24px 80px rgba(0,0,0,.6);overflow:hidden">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)">
        <span style="font-size:16px">🔍</span>
        <input id="cmd-input" placeholder="Search sessions, notes, habits, books…" autofocus
          style="flex:1;background:none;border:none;color:var(--text);font-size:15px;outline:none;font-family:var(--font)"
          oninput="renderPaletteResults(this.value)"/>
        <kbd style="background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--text3)">Esc</kbd>
      </div>
      <div id="cmd-results" style="max-height:380px;overflow-y:auto;padding:8px"></div>
    </div>`;
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeCommandPalette();});
  document.body.appendChild(overlay);
  document.getElementById('cmd-input').focus();
  renderPaletteResults('');
}

function closeCommandPalette(){
  _paletteOpen=false;
  document.getElementById('cmd-palette')?.remove();
}

function renderPaletteResults(q){
  const container=document.getElementById('cmd-results');if(!container)return;
  const lq=q.toLowerCase().trim();
  const results=[];

  // Quick actions (always shown when empty query)
  if(!lq){
    results.push({icon:'📅',label:'Go to Today',sub:'Your daily check-in',fn:"closeCommandPalette();switchView('today')"});
    results.push({icon:'📊',label:'Go to Dashboard',sub:'Streaks, XP, achievements',fn:"closeCommandPalette();switchView('dashboard')"});
    results.push({icon:'🍅',label:'Start Pomodoro',sub:'25 min focus session',fn:'closeCommandPalette();startPomodoro()'});
    results.push({icon:'📔',label:'Daily Journal',sub:'Reflect on today',fn:'closeCommandPalette();showJournal()'});
    results.push({icon:'🔁',label:'Show Reviews Due',sub:'Spaced repetition',fn:'closeCommandPalette();showDueReviews()'});
    results.push({icon:'📊',label:'Monthly Report',sub:'Copy to clipboard',fn:'closeCommandPalette();showMonthlyReport()'});
    results.push({icon:'🗺️',label:'Learning Roadmap',sub:'All 7 plans overview',fn:'closeCommandPalette();showRoadmap()'});
  }

  // Sessions search
  enabledPlans.forEach(pid=>{
    const plan=PLAN_REGISTRY[pid];if(!plan)return;
    plan.sessions.forEach(m=>{
      const match=!lq||(m.title.toLowerCase().includes(lq)||m.topics.some(t=>t.toLowerCase().includes(lq)));
      if(!match)return;
      const s=state[sk(pid,m.id)];
      const status=s?.status||'pending';
      results.push({
        icon:plan.icon,
        label:`Day ${m.id}: ${m.title}`,
        sub:`${plan.name} · ${status==='completed'?'✓ Done':status==='skipped'?'↷ Skipped':'Pending'}`,
        fn:`closeCommandPalette();openSession('${sk(pid,m.id)}')`
      });
    });
  });

  // Notes search
  if(lq){
    enabledPlans.forEach(pid=>{
      const plan=PLAN_REGISTRY[pid];if(!plan)return;
      plan.sessions.forEach(m=>{
        const s=state[sk(pid,m.id)];
        if(s?.note&&s.note.toLowerCase().includes(lq)){
          results.push({
            icon:'📝',
            label:`Note: ${m.title}`,
            sub:s.note.substring(0,60)+'…',
            fn:`closeCommandPalette();openSession('${sk(pid,m.id)}')`
          });
        }
      });
    });
  }

  // Books search
  if(lq||!lq){
    _books.filter(b=>!lq||(b.title.toLowerCase().includes(lq)||b.author.toLowerCase().includes(lq))).slice(0,3).forEach(b=>{
      results.push({
        icon:b.emoji||'📗',
        label:b.title,
        sub:`${b.author||''}  · ${b.status==='reading'?'Currently reading':b.status==='finished'?'Finished':'Want to read'}`,
        fn:`closeCommandPalette();switchView('books');_booksView='detail';_detailBookId='${b.id}';renderBooks()`
      });
    });
  }

  // Limit + render
  const display=results.slice(0,12);
  container.innerHTML=display.length
    ?display.map((r,i)=>`
      <div onclick="${r.fn}" role="option" tabindex="0"
        style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;transition:background .1s"
        onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''"
        onkeydown="if(event.key==='Enter')${r.fn}">
        <div style="font-size:20px;width:32px;text-align:center;flex-shrink:0">${r.icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.label}</div>
          <div style="font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.sub}</div>
        </div>
      </div>`).join('')
    :`<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px">No results for "${q}"</div>`;
}

// ═══════════════════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS — merge both keydown handlers into one
// ═══════════════════════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  // Login screen Enter
  if(e.key==='Enter'&&document.getElementById('login-screen').style.display!=='none'){doLogin();return;}
  // Block shortcuts when typing
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'){
    if(e.key==='Escape'){ closeModal();closeCommandPalette(); }
    return;
  }
  // Command palette
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openCommandPalette();return;}
  // Tab switching
  if(e.key==='1') switchView('today');
  if(e.key==='2') switchView('dashboard');
  if(e.key==='3') switchView('habits');
  if(e.key==='4') switchView('plans');
  if(e.key==='5') switchView('books');
  // Tool shortcuts
  if(e.key.toLowerCase()==='p'&&!e.metaKey) startPomodoro();
  if(e.key.toLowerCase()==='t'&&!e.metaKey) startTimer(120);
  if(e.key.toLowerCase()==='f'&&!e.metaKey) toggleFocusMode();
  if(e.key.toLowerCase()==='j'&&!e.metaKey) showJournal();
  if(e.key.toLowerCase()==='b'&&!e.metaKey) showBookmarks();
  if(e.key.toLowerCase()==='r'&&!e.metaKey) showMonthlyReport();
  if(e.key==='?') showKeyboardShortcuts();
  if(e.key==='Escape'){ closeModal();closeCommandPalette(); }
});

// ═══════════════════════════════════════════════════════════════════════
// QUOTE PRE-CACHE — bulk-fetch 100 quotes on app open so Browse tab
// is instant even if the live API goes down
// ═══════════════════════════════════════════════════════════════════════
function preCacheQuotes(){
  const cacheKey='lt_qbulk';
  const cacheDate='lt_qbulk_date';
  const today=new Date().toDateString();
  if(localStorage.getItem(cacheDate)===today) return; // already done today
  const cats=['learning','consistency','tech','growth','cloud','random'];
  // Fire all fetches in parallel, cache the pools
  Promise.allSettled(cats.map(cat=>fetchFromQuotable(cat).then(qs=>{
    if(qs&&qs.length) setQuotePool(cat,qs);
  }))).then(()=>{
    localStorage.setItem(cacheDate,today);
  });
}

// SWIPE NAVIGATION
// ═══════════════════════════════════════════════════════════════════════
let _tx=0,_ty=0;
document.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx,dy=e.changedTouches[0].clientY-_ty;
  if(Math.abs(dx)<Math.abs(dy)||Math.abs(dx)<60)return;
  const views=['today','dashboard','habits','plans','books'];
  const cur=views.indexOf(currentView);
  if(dx<0&&cur<views.length-1)switchView(views[cur+1]);
  if(dx>0&&cur>0)switchView(views[cur-1]);
},{passive:true});
</script>
