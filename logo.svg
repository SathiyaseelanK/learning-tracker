<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1fcc6e"/>
      <stop offset="100%" stop-color="#28e67a"/>
    </linearGradient>
    <linearGradient id="left-page" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b3fe0"/>
      <stop offset="100%" stop-color="#6c4ff6"/>
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#1a1f36" stroke-width="8"/>

  <!-- Background fill -->
  <circle cx="100" cy="100" r="88" fill="#0b0e1a"/>

  <!-- ── OPEN BOOK ── -->
  <g filter="url(#drop-shadow)">
    <!-- Left page (purple) -->
    <rect x="30" y="128" width="62" height="34" rx="6" fill="url(#left-page)"/>
    <!-- Right page (blue) -->
    <rect x="108" y="128" width="62" height="34" rx="6" fill="#3d7fff"/>
    <!-- Spine gap -->
    <rect x="92" y="126" width="16" height="38" rx="0" fill="#0b0e1a"/>
    <!-- Page lines left -->
    <rect x="37" y="137" width="47" height="4" rx="2" fill="white" opacity="0.25"/>
    <rect x="37" y="147" width="38" height="4" rx="2" fill="white" opacity="0.2"/>
    <rect x="37" y="157" width="43" height="4" rx="2" fill="white" opacity="0.18"/>
    <!-- Page lines right -->
    <rect x="116" y="137" width="47" height="4" rx="2" fill="white" opacity="0.25"/>
    <rect x="116" y="147" width="38" height="4" rx="2" fill="white" opacity="0.2"/>
    <rect x="116" y="157" width="43" height="4" rx="2" fill="white" opacity="0.18"/>
  </g>

  <!-- ── STEM ── -->
  <rect x="97" y="48" width="6" height="82" rx="3" fill="#1fcc6e"/>

  <!-- ── LEFT LEAF ── -->
  <g transform="rotate(-38, 100, 100)">
    <ellipse cx="78" cy="88" rx="20" ry="12" fill="url(#leaf-grad)"/>
  </g>
  <!-- leaf vein left -->
  <line x1="63" y1="89" x2="95" y2="98" stroke="#005c28" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- ── RIGHT LEAF ── -->
  <g transform="rotate(38, 100, 100)">
    <ellipse cx="122" cy="88" rx="20" ry="12" fill="#28e67a"/>
  </g>
  <!-- leaf vein right -->
  <line x1="105" y1="92" x2="137" y2="83" stroke="#005c28" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- ── SPARKLE LARGE ── -->
  <g transform="translate(143, 52)">
    <path d="M0,-9 L2.2,-2.2 L9,0 L2.2,2.2 L0,9 L-2.2,2.2 L-9,0 L-2.2,-2.2 Z" fill="#f5a623"/>
  </g>

  <!-- ── SPARKLE SMALL ── -->
  <g transform="translate(158, 78)">
    <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z" fill="#f5a623"/>
  </g>
</svg>
